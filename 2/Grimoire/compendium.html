<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendium Universel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@300;500;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --aff-pyros: #ff4d4d;
            --aff-aquaria: #4dffff;
            --aff-aeris: #e6e6e6;
            --aff-lumia: #ffffcc;
            --aff-umbra: #aa88ff;
            --aff-fulgora: #ffd700;
            --aff-verdania: #77ff77;
            --aff-terra: #cd853f;
            --aff-bestia: #ffaa88;
            --card-bg: rgba(20, 20, 25, 0.9);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: #050505;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 2s infinite ease-in-out;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.8;
            }

            50% {
                opacity: 0.3;
            }
        }

        .header-section {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            margin: 0;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        /* SEARCH BAR */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            transition: 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #d4af37;
            background: rgba(0, 0, 0, 0.6);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 0.9rem;
        }

        .back-link {
            position: absolute;
            left: 30px;
            top: 35px;
            color: #aaa;
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #fff;
        }

        /* FILTRES */
        .filter-bar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding-bottom: 10px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: #aaa;
            padding: 6px 12px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            font-size: 0.8rem;
            border-radius: 4px;
            transition: 0.3s;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .filter-btn.active {
            border-color: #d4af37;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
            font-weight: bold;
        }

        /* --- GRILLE --- */
        .grid-container {
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* --- CARTE --- */
        .spell-card-wrapper {
            position: relative;
            border-radius: 6px;
            padding: 2px;
            background: #333;
            /* Remplacé par gradient JS */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
            cursor: pointer;
        }

        .spell-card-wrapper:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(212, 175, 55, 0.4);
            filter: brightness(1.1);
        }

        .spell-card-inner {
            background: var(--card-bg);
            border-radius: 4px;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .s-name {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            margin: 0;
            color: #fff;
        }

        .s-type {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .s-icon {
            font-size: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
        }

        .s-desc {
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.5;
            flex-grow: 1;
            margin: 10px 0;

            /* Truncation logic */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
        }

        .rank-badge {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #444;
        }

        .rank-badge.rank-v {
            background: linear-gradient(135deg, #ffffcc, #d4af37, #aa88ff, #1a0033, #aa88ff, #d4af37, #ffffcc);
            background-size: 400% 400%;
            animation: luxombre 4s ease-in-out infinite;
            border: 1px solid #d4af37;
            color: #fff;
            text-shadow: 0 0 6px #d4af37, 0 0 12px #aa88ff;
            box-shadow: 0 0 8px rgba(170, 136, 255, 0.5), inset 0 0 4px rgba(212, 175, 55, 0.3);
        }

        @keyframes luxombre {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .rank-badge.rank-iv {
            background: rgba(255, 68, 255, 0.15);
            border: 1px solid #ff44ff;
            color: #ff44ff;
            animation: cimePulse 2.5s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(255, 68, 255, 0.3);
        }

        @keyframes cimePulse {

            0%,
            100% {
                box-shadow: 0 0 6px rgba(255, 68, 255, 0.3);
            }

            50% {
                box-shadow: 0 0 12px rgba(255, 68, 255, 0.6);
            }
        }

        .badges-container {
            display: flex;
            gap: 5px;
        }

        .aff-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: #101216;
            border: 1px solid var(--border);
            width: 500px;
            max-width: 90%;
            padding: 40px;
            border-radius: 6px;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            color: #666;
            font-family: 'Rajdhani', sans-serif;
        }

        .modal-close:hover {
            color: #fff;
        }

        .m-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            border: 2px dashed #fff;
            animation: spin 10s linear infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="stars" id="stars-container"></div>

    <div class="header-section">
        <a href="../codex_hub.html" class="back-link">◄ Retour</a>
        <h1>COMPENDIUM UNIVERSEL</h1>

        <div class="search-wrapper">
            <div class="search-icon">🔍</div>
            <input type="text" id="searchInput" class="search-input" placeholder="Rechercher (ex: Fire, Explosion...)"
                onkeyup="renderGrid()">
        </div>

        <div class="filter-bar" id="filter-container">
        </div>
    </div>

    <div class="grid-container" id="grid">
    </div>
    <div class="modal-overlay" id="modal" onclick="closeModal(event)">
        <div class="modal-box">
            <div class="modal-close" onclick="closeModalBtn()">✖ FERMER</div>
            <div class="m-circle" id="m-circle">?</div>
            <h2 id="m-name" style="font-family:'Cinzel', serif; color:#d4af37; margin:0;">Titre</h2>
            <div id="m-meta" style="font-family:'Rajdhani', sans-serif; color:#00f3ff; margin:10px 0 20px 0;">META</div>
            <div id="m-desc"
                style="font-family:'Cormorant Garamond', serif; font-size:1.1rem; line-height:1.6; color:#ddd; text-align:justify; margin-bottom: 20px;">
                Description</div>

            <div style="text-align: left; border-top: 1px solid #333; padding-top: 15px; margin-top: 15px;">
                <h4 style="color: #d4af37; margin: 0 0 5px 0; font-family: 'Cinzel', serif;">NATURE DU SORT</h4>
                <div id="m-lore" style="font-family: 'Cormorant Garamond', serif; color: #aaa; font-style: italic;">...
                </div>
            </div>

            <div style="text-align: left; margin-top: 15px;">
                <h4 style="color: #d4af37; margin: 0 0 5px 0; font-family: 'Cinzel', serif;">ORIGINE & OBTENTION</h4>
                <div id="m-origin" style="font-family: 'Cormorant Garamond', serif; color: #aaa;">...</div>
            </div>
        </div>
    </div>

    <script src="../../js/db_spells.js" charset="UTF-8"></script>
    <script>
        // --- DATA ---
        const colors = {
            "Pyros": "var(--aff-pyros)", "Aquaria": "var(--aff-aquaria)", "Aeris": "var(--aff-aeris)",
            "Lumia": "var(--aff-lumia)", "Umbra": "var(--aff-umbra)", "Fulgora": "var(--aff-fulgora)",
            "Verdania": "var(--aff-verdania)", "Terra": "var(--aff-terra)", "Bestia": "var(--aff-bestia)"
        };
        const affinitiesList = ["Pyros", "Aquaria", "Aeris", "Lumia", "Umbra", "Fulgora", "Verdania", "Terra", "Bestia"];

        // Subtypes mapping based on DB analysis
        // Subtypes mapping based on DB analysis
        const subtypes = {
            "Pyros": ["Ignis", "Vulcan", "Fumar"],
            "Aquaria": ["Glacius", "Nebula", "Abyssus"],
            "Aeris": ["Stratos", "Zephyria", "Vacuum"],
            "Terra": ["Metallia", "Seismis", "Golem"],
            "Fulgora": ["Tempestra", "Electra", "Ionis"],
            "Lumia": ["Solara", "Luxia", "Photis"],
            "Umbra": ["Noctis", "Nyx", "Abyssum"],
            "Verdania": ["Floralis", "Radicis", "Venomera"],
            "Bestia": []
        };

        let activeFilters = []; // Main affinities
        let activeSubFilters = []; // Specific affinities

        // --- INIT ---
        function init() {
            generateStars();
            generateFilters();
            renderGrid();
        }

        function generateStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 80; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.width = Math.random() * 2 + 1 + 'px';
                s.style.height = s.style.width;
                container.appendChild(s);
            }
        }

        function generateFilters() {
            const container = document.getElementById('filter-container');
            container.innerHTML = ''; // Clear if re-generated

            // 1. ALL Button
            const resetBtn = document.createElement('button');
            resetBtn.className = 'filter-btn active';
            resetBtn.id = 'btn-all';
            resetBtn.innerText = "TOUT";
            resetBtn.onclick = () => resetFilters();
            container.appendChild(resetBtn);

            // 2. Main Affinity Buttons
            affinitiesList.forEach(aff => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.id = `btn-${aff}`;
                btn.innerText = aff;
                btn.onclick = function () { toggleFilter(aff, this); };
                container.appendChild(btn);
            });

            // 3. Sub-filter Container (New line)
            const subContainer = document.createElement('div');
            subContainer.id = 'sub-filter-container';
            subContainer.style.width = '100%';
            subContainer.style.display = 'flex';
            subContainer.style.justifyContent = 'center';
            subContainer.style.gap = '8px';
            subContainer.style.marginTop = '10px';
            subContainer.style.flexWrap = 'wrap';
            container.appendChild(subContainer);
        }

        // --- FILTER LOGIC ---
        function toggleFilter(aff, btn) {
            document.getElementById('btn-all').classList.remove('active');

            if (activeFilters.includes(aff)) {
                // Remove Filter
                activeFilters = activeFilters.filter(item => item !== aff);
                btn.classList.remove('active');

                // Remove associated sub-filters from UI and active list
                removeSubFiltersFor(aff);
            } else {
                // Add Filter
                activeFilters.push(aff);
                btn.classList.add('active');

                // Show sub-filters
                renderSubFiltersFor(aff);
            }

            if (activeFilters.length === 0) resetFilters();
            else renderGrid();
        }

        function renderSubFiltersFor(mainAff) {
            const subContainer = document.getElementById('sub-filter-container');
            const subs = subtypes[mainAff] || [];

            subs.forEach(sub => {
                // Avoid duplicates if already rendered (rare case with multiple mains strictly sharing a subtype name, unlikely here)
                if (document.getElementById(`btn-sub-${sub}`)) return;

                const btn = document.createElement('button');
                btn.className = 'filter-btn'; // Re-use style
                btn.style.borderColor = colors[mainAff]; // Color hint
                btn.style.color = '#ccc';
                btn.style.fontSize = '0.75rem';
                btn.id = `btn-sub-${sub}`;
                btn.innerText = sub;
                btn.onclick = function () { toggleSubFilter(sub, this, mainAff); };

                // Data attribute to know parent
                btn.dataset.parent = mainAff;

                subContainer.appendChild(btn);
            });
        }

        function removeSubFiltersFor(mainAff) {
            const subContainer = document.getElementById('sub-filter-container');
            const buttons = subContainer.querySelectorAll(`[data-parent="${mainAff}"]`);

            buttons.forEach(btn => {
                const subName = btn.innerText;
                // Remove from activeSubFilters if it was selected
                activeSubFilters = activeSubFilters.filter(s => s !== subName);
                btn.remove();
            });
        }

        function toggleSubFilter(sub, btn, mainAff) {
            if (activeSubFilters.includes(sub)) {
                activeSubFilters = activeSubFilters.filter(s => s !== sub);
                btn.classList.remove('active');
                btn.style.background = 'rgba(255, 255, 255, 0.05)';
                btn.style.color = '#ccc';
            } else {
                activeSubFilters.push(sub);
                btn.classList.add('active');
                // Use parent color for highlight
                btn.style.background = colors[mainAff] + '33'; // Low opacity
                btn.style.color = colors[mainAff];
            }
            renderGrid();
        }

        function resetFilters() {
            activeFilters = [];
            activeSubFilters = [];
            document.querySelectorAll('.filter-btn').forEach(b => {
                if (b.id !== 'btn-all') b.classList.remove('active');
            });
            // Clear sub-container
            const subContainer = document.getElementById('sub-filter-container');
            if (subContainer) subContainer.innerHTML = '';

            document.getElementById('btn-all').classList.add('active');
            renderGrid();
        }

        // --- SCORE SYSTEM ---
        function calculateScore(spell) {
            // Case 0: No filters
            if (activeFilters.length === 0 && activeSubFilters.length === 0) return spell.complexity;

            let score = 0;

            // 1. Check Sub-filters (Priority)
            if (activeSubFilters.length > 0) {
                let specificMatches = 0;

                if (spell.specific) {
                    if (spell.specific.includes("/")) {
                        // Split dual affinities
                        const parts = spell.specific.split("/").map(s => s.trim());
                        parts.forEach(p => {
                            if (activeSubFilters.includes(p)) specificMatches++;
                        });
                    } else {
                        // Single affinity
                        if (activeSubFilters.includes(spell.specific)) specificMatches++;
                    }
                }

                // Add huge score for EACH specific match (2000 per match)
                // This ensures that satisfying 2 specific filters > satisfying 1
                if (specificMatches > 0) {
                    score += (specificMatches * 2000);
                }
            }

            // 2. Check Main Filters
            if (activeFilters.length > 0) {
                let matches = 0;
                spell.affinities.forEach(aff => { if (activeFilters.includes(aff)) matches++; });

                if (matches > 0) score += 500;
            }

            return score + spell.complexity;
        }

        // --- HELPER: SHORT DESC ---
        function getShortDesc(spell) {
            // 1. Get full text or fallback to desc
            let text = spell.full_desc || spell.desc || "";

            // 2. Remove HTML breaks
            text = text.replace(/<br\s*\/?>/gi, ' ').trim();

            // 3. Try to take the first sentence
            const firstDot = text.indexOf('.');
            if (firstDot !== -1) {
                // If the first sentence is reasonably long, take it
                // If it's super short (ex: "Sort."), maybe take more? 
                // For now, let's just take the first sentence + dot.
                return text.substring(0, firstDot + 1);
            }

            return text;
        }

        // --- RENDER GRID ---
        function renderGrid() {
            const grid = document.getElementById('grid');
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = "";

            let sortedSpells = [...spellsDB];
            sortedSpells.sort((a, b) => calculateScore(b) - calculateScore(a));

            sortedSpells.forEach(spell => {
                // 1. TEXT FILTER (Strict hide)
                const textMatch = spell.name.toLowerCase().includes(searchInput) ||
                    (spell.full_desc || spell.desc).toLowerCase().includes(searchInput);
                if (!textMatch) return;

                // 2. CREATE CARD
                const wrapper = document.createElement('div');
                wrapper.className = 'spell-card-wrapper';

                // 3. OPACITY (Sort visual)
                const score = calculateScore(spell);

                // Determine Threshold
                // - No filters: 0 (Show all)
                // - Main filters only: 10 (Must have match, not just complexity - complexity max is 5)
                // - Sub filters active: 1000 (Hide Main-only matches, show Specific matches)
                let threshold = 10;
                if (activeSubFilters.length > 0) threshold = 1000;

                if ((activeFilters.length > 0 || activeSubFilters.length > 0) && score <= threshold) {
                    wrapper.style.opacity = "0.2";
                    wrapper.style.transform = "scale(0.95)";
                } else {
                    wrapper.style.opacity = "1";
                    wrapper.style.transform = "scale(1)";
                }

                // 4. GRADIENT BORDER (Dynamic)
                let stops = spell.affinities.map(aff => colors[aff] || '#fff').join(', ');
                if (spell.affinities.length === 1) stops = `${colors[spell.affinities[0]]}, ${colors[spell.affinities[0]]}`;
                wrapper.style.background = `linear-gradient(135deg, ${stops})`;

                const romans = { 1: "I", 2: "II", 3: "III", 4: "IV", 5: "V" };
                const isRankV = spell.complexity === 5;
                const isRankIV = spell.complexity === 4;
                const rankColor = spell.complexity === 5 ? '#fff' : (spell.complexity === 4 ? '#ff44ff' : (spell.complexity === 3 ? '#d4af37' : (spell.complexity === 2 ? '#00f3ff' : '#aaa')));
                let badges = spell.affinities.map(a => `<div class="aff-badge" style="background:${colors[a]};" title="${a}"></div>`).join('');
                const rankText = romans[spell.complexity] || "?";

                // Short description generation
                const shortDesc = getShortDesc(spell);

                wrapper.innerHTML = `
                    <div class="spell-card-inner">
                        <div class="card-header">
                            <div>
                                <h3 class="s-name">${spell.name}</h3>
                                <div class="s-type">${spell.type}</div>
                            </div>
                            <div class="s-icon" style="color:${colors[spell.affinities[0]]}">${spell.symbol}</div>
                        </div>
                        <div class="s-desc">${shortDesc}</div>
                        <div class="card-footer">
                            <div class="rank-badge ${isRankV ? 'rank-v' : (isRankIV ? 'rank-iv' : '')}" style="${(isRankV || isRankIV) ? '' : 'color:' + rankColor + '; border-color:' + rankColor}">RG ${rankText}</div>
                            <div class="badges-container">${badges}</div>
                        </div>
                    </div>
                `;
                wrapper.innerHTML += `<!-- Specific: ${spell.specific} | Score: ${score} -->`; // Debug info hidden
                wrapper.onclick = () => window.location.href = `details_sort.html?id=${spell.id}`;
                grid.appendChild(wrapper);
            });
        }




        init();
    </script>
</body>

</html>
