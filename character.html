<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Dossier Personnage</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <script src="js/db_characters.js"></script>

    <style>
        /* --- VARIABLES GLOBALES --- */
        :root {
            --bg-deep: #05050b;
            --text-main: #e0e0e0;
            --gold: #d4af37;
            --cyan: #00f3ff;
            
            /* Couleurs par défaut */
            --col-pyros: #e74c3c; --col-aquaria: #3498db; --col-aeris: #bdc3c7;
            --col-lumia: #f1c40f; --col-umbra: #8e44ad; --col-fulgora: #f39c12;
            --col-verdania: #2ecc71; --col-terra: #d35400; --col-bestia: #e84393;
        }

        body {
            margin: 0; background-color: var(--bg-deep); color: var(--text-main);
            font-family: 'Cormorant Garamond', serif; height: 100vh; overflow: hidden; display: flex;
        }

        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(2px 2px at 50px 160px, #fff, transparent); background-size: 200px 200px; opacity: 0.3; }

        /* GAUCHE */
        .visual-section { width: 40%; height: 100%; position: relative; }
        .char-img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .gradient-overlay { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(90deg, transparent 50%, var(--bg-deep) 100%); pointer-events: none; }

        /* DROITE */
        .info-section {
            width: 60%; height: 100%; overflow-y: auto; padding: 40px 60px 100px 20px; box-sizing: border-box; position: relative;
        }
        .info-section::-webkit-scrollbar { width: 6px; }
        .info-section::-webkit-scrollbar-track { background: #0a0a10; }
        .info-section::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

        /* --- BADGE DE RANG (GUILDE) --- */
        .guild-badge {
            position: absolute; top: 40px; right: 60px;
            width: 120px; height: 120px; z-index: 20;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
            transition: transform 0.3s;
        }
        .guild-badge:hover { transform: scale(1.1); }

        /* Effets de brillance par niveau */
        .rank-glow-mi { filter: drop-shadow(0 0 15px #cd7f32) drop-shadow(0 0 5px #8c5a2b); } /* Bronze */
        .rank-glow-n { filter: drop-shadow(0 0 15px #e0e0e0) drop-shadow(0 0 5px #ffffff); }  /* Argent */
        .rank-glow-ma { filter: drop-shadow(0 0 20px #ffd700) drop-shadow(0 0 10px #ffeb3b); } /* Or */

        /* TYPO */
        h1 {
            font-family: 'Cinzel', serif; font-size: 3.5rem; margin: 0; line-height: 1;
            color: #ffffff; background: none; -webkit-text-fill-color: initial;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.9), 0 0 30px rgba(212, 175, 55, 0.4);
        }
        .nickname {
            font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; color: var(--cyan);
            text-transform: uppercase; letter-spacing: 4px; margin-top: 10px; margin-bottom: 40px;
            border-left: 3px solid var(--cyan); padding-left: 15px;
        }
        .section-title {
            font-family: 'Rajdhani', sans-serif; color: #666; font-size: 0.8rem; 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; margin-top: 40px;
        }

        /* GRILLES & BOITES */
        .affinity-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        
        .aff-box { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); 
            padding: 15px; text-align: center; border-radius: 4px; 
            text-decoration: none; display: block; transition: 0.3s;
        }
        a.aff-box:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .aff-box.empty { opacity: 0.3; border-style: dashed; cursor: default; }
        
        .aff-name { font-family: 'Cinzel', serif; color: #fff; font-size: 1rem; }
        .aff-sub { font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; color: #888; text-transform: uppercase; margin-top: 5px; }

        /* BESTIA */
        .bestia-block {
            background: rgba(232, 67, 147, 0.05); border: 1px solid var(--col-bestia);
            padding: 15px 20px; border-radius: 4px; display: flex; align-items: center; gap: 20px;
            margin-bottom: 40px; text-decoration: none; transition: 0.3s;
        }
        .bestia-block:hover { background: rgba(232, 67, 147, 0.15); box-shadow: 0 0 15px rgba(232, 67, 147, 0.2); transform: translateX(5px); }
        .bestia-icon { font-size: 2rem; }
        .bestia-info h3 { margin: 0; color: var(--col-bestia); font-family: 'Cinzel', serif; font-size: 1.1rem;}
        .bestia-desc { color: #ccc; font-size: 0.95rem; margin: 5px 0 0 0; }

        /* BOXES POUVOIRS (UNIQUE / EVEIL) */
        .full-desc-box {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
            padding: 25px; margin-bottom: 30px; border-radius: 4px;
        }
        .box-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 15px; }
        .box-title { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #fff; }
        .box-type { font-family: 'Rajdhani', sans-serif; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }

        /* STYLES CONTENU TEXTE */
        .content-text { font-size: 1rem; line-height: 1.6; color: #ccc; margin: 0; text-align: justify; margin-bottom: 10px;}
        .detail-group { margin-bottom: 15px; }
        .detail-label { color: var(--gold); font-family: 'Rajdhani', sans-serif; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; margin-bottom: 5px; display: block; }
        
        ul.tech-list { list-style: none; padding: 0; margin: 10px 0; }
        ul.tech-list li { margin-bottom: 8px; padding-left: 15px; border-left: 2px solid #555; font-size: 0.95rem; color: #bbb; }
        ul.tech-list li strong { color: #fff; }
        .drawback { border-left-color: #e74c3c !important; color: #e7aaaa !important; }

        /* FOOTER */
        .desc-block { margin-bottom: 30px; background: rgba(255,255,255,0.02); border-left: 2px solid rgba(255,255,255,0.1); padding: 20px; }
        .desc-block h2 { font-family: 'Cinzel', serif; font-size: 1.3rem; color: #fff; margin: 0 0 10px 0; }
        .desc-block p { font-size: 1rem; line-height: 1.6; color: #ccc; margin: 0; text-align: justify; }
        
        .quote-box { margin-top: 50px; text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.3rem; color: #888; padding: 30px; border-top: 1px solid rgba(255,255,255,0.05); }

        .fixed-back-btn {
            position: fixed; bottom: 30px; left: 30px; z-index: 100;
            background: rgba(0,0,0,0.8); border: 1px solid var(--cyan); color: var(--cyan);
            font-family: 'Rajdhani', sans-serif; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            text-decoration: none; padding: 10px 20px; font-size: 0.9rem; transition: 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .fixed-back-btn:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

        /* Classe utilitaire pour cacher les éléments vides */
        .hidden { display: none !important; }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; height: auto; }
            .visual-section { width: 100%; height: 40vh; min-height: 300px; flex-shrink: 0; }
            .gradient-overlay { background: linear-gradient(to top, var(--bg-deep) 10%, transparent 100%); }
            .info-section { width: 100%; height: auto; padding: 20px 25px 50px 25px; overflow: visible; }
            h1 { font-size: 2.5rem; }
            .affinity-grid, .special-grid { grid-template-columns: 1fr; }
            .fixed-back-btn { bottom: 20px; left: 50%; transform: translateX(-50%); width: 80%; text-align: center; background: var(--bg-deep); border-color: var(--gold); }
            .guild-badge { width: 80px; height: 80px; top: 20px; right: 20px; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    <a href="personnages.html" class="fixed-back-btn">◄ Registre</a>

    <div class="visual-section">
        <img id="p-img" src="" class="char-img" alt="Portrait">
        <div class="gradient-overlay"></div>
    </div>

    <div class="info-section">
        
        <img id="p-rank-badge" src="" class="guild-badge hidden" alt="Rang Guilde" title="">

        <h1 id="p-name">...</h1>
        <div id="p-nick" class="nickname"></div>

        <div class="section-title">Alignement Planétaire</div>
        <div class="affinity-grid" id="p-affinities">
            </div>

        <a id="p-bestia-link" href="#" class="bestia-block hidden">
            <div class="bestia-icon">🪶</div>
            <div class="bestia-info">
                <h3 id="p-bestia-name"></h3>
                <div id="p-bestia-desc" class="bestia-desc"></div>
            </div>
        </a>

        <div id="p-unique-box" class="full-desc-box hidden">
            <div class="box-header">
                <div class="box-title" id="p-unique-name"></div>
                <div class="box-type" id="p-unique-type"></div>
            </div>
            <div id="p-unique-content"></div>
        </div>

        <div id="p-eveil-box" class="full-desc-box hidden" style="border-color: rgba(212, 175, 55, 0.4);">
            <div class="box-header">
                <div class="box-title" id="p-eveil-name" style="color: var(--gold);"></div>
                <div class="box-type">Éveil Singuar</div>
            </div>
            <div id="p-eveil-content"></div>
        </div>

        <div class="desc-block">
            <h2>📜 Histoire & Psychologie</h2>
            <p id="p-lore"></p>
        </div>

        <div class="quote-box" id="p-quote"></div>

    </div>

    <script>
        // 1. Récupérer l'ID
        const params = new URLSearchParams(window.location.search);
        let charId = params.get('id');

        // Sécurité : si pas d'ID, on charge Lily par défaut (l'ID de la DB)
        if (!charId) { charId = 'lily_eloiranôr'; } 

        // 2. Charger les données
        if (typeof charactersDB !== 'undefined' && charactersDB[charId]) {
            const data = charactersDB[charId];

            // Identité
            document.title = "Dossier : " + data.name;
            document.getElementById('p-name').innerText = data.name;
            document.getElementById('p-nick').innerText = data.nickname;
            document.getElementById('p-img').src = data.img;
            document.getElementById('p-lore').innerText = data.lore;
            document.getElementById('p-quote').innerText = data.quote;

            // RANG DE GUILDE
            if (data.rank) {
                const badge = document.getElementById('p-rank-badge');
                badge.src = `svg/${data.rank.letter}_${data.rank.level}.svg`;
                badge.classList.remove('hidden', 'rank-glow-mi', 'rank-glow-n', 'rank-glow-ma');
                
                if (data.rank.level === 'Mi') badge.classList.add('rank-glow-mi');
                if (data.rank.level === 'N')  badge.classList.add('rank-glow-n');
                if (data.rank.level === 'Ma') badge.classList.add('rank-glow-ma');
                
                const levelNames = { 'Mi': 'Mineur', 'N': 'Normal', 'Ma': 'Majeur' };
                badge.title = `Rang ${data.rank.letter} - ${levelNames[data.rank.level]}`;
            }

            // Affinités
            const affContainer = document.getElementById('p-affinities');
            data.affinities.forEach(aff => {
                if (aff.link) {
                    affContainer.innerHTML += `
                        <a href="${aff.link}" class="aff-box" style="border-color: ${aff.color};">
                            <div class="aff-name" style="color: ${aff.color};">${aff.name}</div>
                            <div class="aff-sub">${aff.sub}</div>
                        </a>`;
                } else {
                    affContainer.innerHTML += `
                        <div class="aff-box empty">
                            <div class="aff-name">-</div>
                            <div class="aff-sub">Aucune</div>
                        </div>`;
                }
            });

            // Bestia
            if (data.bestia) {
                const bBox = document.getElementById('p-bestia-link');
                bBox.classList.remove('hidden');
                bBox.href = data.bestia.link;
                document.getElementById('p-bestia-name').innerText = "Affinité Bestia : " + data.bestia.name;
                document.getElementById('p-bestia-desc').innerText = data.bestia.desc;
            }

            // Unique
            if (data.unique) {
                document.getElementById('p-unique-box').classList.remove('hidden');
                document.getElementById('p-unique-name').innerText = data.unique.name;
                document.getElementById('p-unique-type').innerText = data.unique.type;
                document.getElementById('p-unique-content').innerHTML = data.unique.fullDesc;
            }

            // Eveil
            if (data.eveil) {
                document.getElementById('p-eveil-box').classList.remove('hidden');
                document.getElementById('p-eveil-name').innerText = data.eveil.name;
                document.getElementById('p-eveil-content').innerHTML = data.eveil.fullDesc;
            }

        } else {
            document.querySelector('h1').innerText = "Erreur : Données introuvables";
        }
    </script>

</body>
</html>
