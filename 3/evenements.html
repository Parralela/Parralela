<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Archives - Événements</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/db_events.js" charset="UTF-8"></script>
    <style>
        /* Page Specific Overrides */
        h1 {
            color: var(--col-event);
            text-shadow: 0 0 20px rgba(155, 89, 182, 0.3);
            text-align: center;
            margin-top: 50px;
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            letter-spacing: 5px;
        }

        .subtitle {
            text-align: center;
            font-family: 'Rajdhani', sans-serif;
            color: #888;
            margin-bottom: 60px;
            letter-spacing: 2px;
        }

        /* --- LES 12 PILIERS (CSS REVISITED) --- */
        .pillars-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            /* Aligner en bas pour l'effet de hauteur */
            gap: 25px;
            margin-bottom: 80px;
            padding: 20px;
            height: 150px;
            /* Espace pour le faisceau */
        }

        .pillar {
            width: 16px;
            height: 60px;
            background: #0a0a0a;
            border: 1px solid #333;
            position: relative;
            transition: 0.5s;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            /* Style "colonne" */
            background: linear-gradient(90deg, #0a0a0a 0%, #2a2a2a 50%, #0a0a0a 100%);
        }

        /* Chapiteau et Base du pilier */
        .pillar::before,
        .pillar::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 6px;
            background: #222;
            border: 1px solid #444;
        }

        .pillar::before {
            top: -6px;
        }

        /* Chapiteau */
        .pillar::after {
            bottom: -6px;
        }

        /* Base */

        /* --- PILIER ACTIF (COSMIC) --- */
        .pillar.active {
            height: 70px;
            border-color: #d4af37;
            /* Or pâle pour le bord */
            /* Dégradé cosmique : Violet profond -> Bleu nuit -> Touche de rose */
            background: linear-gradient(180deg, #2E0249 0%, #570A57 40%, #A91079 100%);
            box-shadow:
                0 0 20px rgba(169, 16, 121, 0.8),
                /* Rose/Violet glow */
                0 0 40px rgba(87, 10, 87, 0.6),
                /* Deep purple glow */
                inset 0 0 15px rgba(255, 255, 255, 0.4);
            z-index: 10;
            animation: pillarPulse 3s infinite alternate;
        }

        .pillar.active::before,
        .pillar.active::after {
            background: #d4af37;
            border-color: #fff;
            box-shadow: 0 0 15px #d4af37;
        }

        /* Le Faisceau de Lumière (Beam) */
        .pillar.active .beam {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 0;
            /* Beam cosmique */
            background: linear-gradient(to top, rgba(169, 16, 121, 0.5), rgba(87, 10, 87, 0.2), transparent);
            opacity: 0;
            animation: beamUp 4s infinite;
            pointer-events: none;
            filter: blur(4px);
        }

        /* Particules autour du pilier actif */
        .pillar.active .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .pillar.active .particle {
            position: absolute;
            background: #fff;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 5px #fff, 0 0 10px #d4af37;
            animation: floatUp 3s infinite linear;
        }

        @keyframes pillarPulse {
            0% {
                box-shadow: 0 0 20px rgba(169, 16, 121, 0.6);
                filter: brightness(1);
            }

            100% {
                box-shadow: 0 0 40px rgba(169, 16, 121, 0.9), 0 0 60px rgba(46, 2, 73, 0.8);
                filter: brightness(1.3);
            }
        }

        @keyframes beamUp {
            0% {
                height: 0;
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                height: 150px;
                opacity: 0;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-100px) translateX(10px);
                opacity: 0;
            }
        }

        /* Hover Tooltip */
        .pillar:hover .tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        .tooltip {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            white-space: nowrap;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            border: 1px solid #444;
        }

        .pillar.active .tooltip {
            border-color: #A91079;
            color: #A91079;
            text-shadow: 0 0 5px #A91079;
        }


        /* --- FRISE CHRONOLOGIQUE DYNAMIQUE --- */
        .timeline-wrapper {
            width: 100%;
            height: 600px;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: var(--col-event) #111;
        }

        .timeline-wrapper::-webkit-scrollbar {
            height: 8px;
        }

        .timeline-wrapper::-webkit-scrollbar-track {
            background: #111;
        }

        .timeline-wrapper::-webkit-scrollbar-thumb {
            background: var(--col-event);
            border-radius: 4px;
        }

        .timeline-container {
            position: relative;
            height: 100%;
        }

        /* La Frise (Barre supérieure) */
        .timeline-frieze {
            position: absolute;
            top: 80px;
            left: 0;
            width: 100%;
            height: 6px;
            background: #222;
            border-top: 1px solid #444;
            border-bottom: 1px solid #444;
            z-index: 0;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .timeline-frieze::after {
            content: '';
            position: absolute;
            top: 1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--col-event) 20%, var(--col-event) 80%, transparent 100%);
            opacity: 0.5;
        }

        .event-node {
            position: absolute;
            top: 73px;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            animation: fadeIn 0.8s ease-out forwards;
            z-index: 1;
            transform: translateX(-50%);
        }

        .node-point {
            width: 20px;
            height: 20px;
            background: var(--bg-deep);
            border: 3px solid var(--col-event);
            border-radius: 50%;
            z-index: 10;
            box-shadow: 0 0 15px var(--col-event);
            transition: 0.3s;
            margin-bottom: 40px;
            cursor: pointer;
            position: relative;
        }

        .node-point::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background: var(--col-event);
            border-radius: 50%;
            opacity: 0;
            transition: 0.3s;
        }

        .event-node:hover .node-point {
            background: var(--col-event);
            transform: scale(1.3);
            box-shadow: 0 0 30px var(--col-event);
        }

        .event-node:hover .node-point::before {
            opacity: 1;
            background: #fff;
        }

        .time-marker {
            position: absolute;
            top: 35px;
            font-family: 'Rajdhani', sans-serif;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            text-align: center;
            width: 120px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .event-content {
            width: 100%;
            padding: 25px;
            background: rgba(20, 25, 30, 0.7);
            border: 1px solid rgba(155, 89, 182, 0.2);
            border-radius: 6px;
            backdrop-filter: blur(8px);
            transition: 0.3s;
            position: relative;
            text-align: center;
        }

        .event-content::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 12px 12px 12px;
            border-style: solid;
            border-color: transparent transparent rgba(155, 89, 182, 0.2) transparent;
            transition: 0.3s;
        }

        .event-node:hover .event-content {
            border-color: var(--col-event);
            background: rgba(30, 35, 45, 0.95);
            transform: translateY(-5px);
            z-index: 20;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .event-node:hover .event-content::before {
            border-bottom-color: var(--col-event);
        }

        .event-content.highlight {
            border-color: var(--col-event);
            box-shadow: 0 0 30px rgba(155, 89, 182, 0.2);
            background: linear-gradient(to bottom, rgba(30, 35, 45, 0.95), rgba(155, 89, 182, 0.1));
        }

        .event-meta {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-family: 'Rajdhani', sans-serif;
            color: var(--col-event);
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .event-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: #fff;
            margin: 10px 0;
            line-height: 1.3;
        }

        .event-desc {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="stars-container"></div>
    <a href="timeline.html" class="back-btn">◄ Retour Chronologie</a>

    <h1>ÉVÉNEMENTS MAJEURS</h1>
    <div class="subtitle">Les points de bascule du destin</div>

    <!-- LES 12 PILIERS -->
    <div class="pillars-container">
        <div class="pillar active">
            <div class="beam"></div>
            <div class="particles">
                <div class="particle" style="left: 20%; animation-delay: 0s;"></div>
                <div class="particle" style="left: 50%; animation-delay: 0.5s;"></div>
                <div class="particle" style="left: 80%; animation-delay: 1s;"></div>
            </div>
            <div class="tooltip">I - Le Sang Versé</div>
        </div>
        <div class="pillar">
            <div class="tooltip">II - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">III - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">IV - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">V - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">VI - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">VII - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">VIII - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">IX - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">X - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">XI - ???</div>
        </div>
        <div class="pillar">
            <div class="tooltip">XII - ???</div>
        </div>
    </div>

    <div class="timeline-wrapper">
        <div class="timeline-container" id="timeline-container">
            <div class="timeline-frieze"></div>
            <!-- Les événements seront injectés ici par JS -->
        </div>
    </div>

    <script>
        // --- CONFIGURATION DE LA FRISE ---
        const START_YEAR = 623;      // Année de départ de la frise
        const BASE_SPACING = 340;    // Espace minimum par carte (largeur carte + marge)
        const PIXELS_PER_YEAR = 50;  // Espace supplémentaire par année
        const START_PADDING = 350;    // Marge au début

        // --- DONNÉES DES ÉVÉNEMENTS (voir js/db_events.js) ---
        const events = eventsDB;

        // --- GÉNÉRATION DU DOM ---
        const timelineContainer = document.getElementById('timeline-container');

        function renderTimeline() {
            // Calculer la largeur totale
            // La position du dernier élément détermine la largeur
            const lastIndex = events.length - 1;
            const lastYearDiff = events[lastIndex].year - START_YEAR;
            const maxPos = (lastIndex * BASE_SPACING) + (lastYearDiff * PIXELS_PER_YEAR) + START_PADDING;

            timelineContainer.style.width = `${maxPos + 400}px`;

            events.forEach((evt, index) => {
                const node = document.createElement('div');
                node.className = 'event-node';

                // Positionnement HYBRIDE : Index (pour l'ordre/non-chevauchement) + Temps (pour la nuance)
                const yearDiff = evt.year - START_YEAR;
                const leftPos = (index * BASE_SPACING) + (yearDiff * PIXELS_PER_YEAR) + START_PADDING;

                node.style.left = `${leftPos}px`;

                node.style.animationDelay = `${0.1 + (index * 0.1)}s`;

                const highlightClass = evt.highlight ? 'highlight' : '';

                node.innerHTML = `
                    <div class="node-point"></div>
                    <div class="time-marker">An ${evt.year}</div>
                    <div class="event-content ${highlightClass}">
                        <div class="event-meta">
                            <span>${evt.chapters}</span>
                            <span>Âge : ${evt.age}</span>
                        </div>
                        <h3 class="event-title">${evt.title}</h3>
                        <div class="event-desc">${evt.desc}</div>
                    </div>
                `;

                timelineContainer.appendChild(node);
            });
        }

        renderTimeline();

        // --- GÉNÉRATION DES ÉTOILES ---
        const starContainer = document.querySelector('.stars-container');
        if (starContainer) {
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.background = 'white';
                star.style.borderRadius = '50%';
                star.style.opacity = Math.random() * 0.8 + 0.2;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 2 + 'px';
                star.style.height = star.style.width;
                starContainer.appendChild(star);
            }
        }
        // --- SCROLL HORIZONTAL AVEC LA MOLETTE ---
        const scrollContainer = document.querySelector('.timeline-wrapper');

        scrollContainer.addEventListener('wheel', (evt) => {
            evt.preventDefault();
            scrollContainer.scrollLeft += evt.deltaY;
        });
    </script>

</body>

</html>
