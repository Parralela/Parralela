<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Lecture - Parralela</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Reader Specific Styles */
        body.reader-page {
            align-items: center;
        }

        .reader-container {
            width: 90%;
            max-width: 900px;
            background: rgba(10, 15, 20, 0.95);
            border: 1px solid var(--border);
            margin: 40px 0 100px 0;
            padding: 60px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            position: relative;
            min-height: 80vh;
        }

        .chapter-header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 30px;
        }

        .ch-number {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem;
            color: var(--col-chapter);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .ch-title-main {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: #fff;
            margin: 0;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.2);
        }

        .reader-content {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            line-height: 1.8;
            color: #ddd;
            text-align: justify;
        }

        .reader-content p {
            margin-bottom: 20px;
        }

        .reader-content strong {
            color: #fff;
            font-weight: bold;
        }

        .reader-content em {
            color: #aaa;
        }

        /* Markdown Styles */
        .reader-content h1,
        .reader-content h2,
        .reader-content h3 {
            font-family: 'Cinzel', serif;
            color: var(--col-chapter);
            margin-top: 40px;
            margin-bottom: 20px;
            text-align: center;
        }

        .reader-content h1 {
            font-size: 2rem;
            border-bottom: 1px solid rgba(243, 156, 18, 0.3);
            padding-bottom: 10px;
        }

        .reader-content h2 {
            font-size: 1.6rem;
        }

        .reader-content hr {
            border: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: 40px 0;
        }

        /* Navigation Controls */
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-btn {
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.5);
        }

        .nav-btn:hover {
            background: var(--col-chapter);
            border-color: var(--col-chapter);
            color: #000;
        }

        .nav-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
            border-color: transparent;
        }

        .chapter-select {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            color: #888;
            font-style: italic;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .reader-container {
                padding: 30px;
                width: 95%;
            }

            .ch-title-main {
                font-size: 2rem;
            }

            .nav-controls {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body class="reader-page">

    <div class="stars-container"></div>
    <a href="chapitres.html" class="back-btn">◄ Retour Bibliothèque</a>

    <div class="reader-container">
        <div class="chapter-header">
            <div class="ch-number" id="ch-number">Chapitre --</div>
            <h1 class="ch-title-main" id="ch-title">Chargement...</h1>
        </div>

        <div class="reader-content" id="reader-content">
            <div class="loading">Chargement du parchemin...</div>
        </div>

        <div class="nav-controls">
            <a href="#" class="nav-btn" id="prev-btn">◄ Précédent</a>
            <select class="chapter-select" id="chapter-select"></select>
            <a href="#" class="nav-btn" id="tapas-btn" style="display:none; border-color: #f39c12; color: #f39c12;">Lire
                sur Tapas ⬈</a>
            <a href="#" class="nav-btn" id="next-btn">Suivant ►</a>
        </div>
    </div>

    <script src="../js/chapters.js"></script>
    <script>
        // --- LOGIQUE DU LECTEUR ---

        // 1. Récupérer l'ID depuis l'URL
        const urlParams = new URLSearchParams(window.location.search);
        let currentId = parseInt(urlParams.get('id'));
        if (isNaN(currentId)) currentId = 1; // Défaut au chapitre 1

        // Éléments DOM
        const titleEl = document.getElementById('ch-title');
        const numEl = document.getElementById('ch-number');
        const contentEl = document.getElementById('reader-content');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const selectEl = document.getElementById('chapter-select');

        // 2. Initialiser le selecteur (uniquement les chapitres publiés sur Tapas)
        publishedChapters.forEach(ch => {
            const option = document.createElement('option');
            option.value = ch.id;
            option.textContent = `Ch. ${ch.id} - ${ch.title}`;
            if (ch.id === currentId) option.selected = true;
            selectEl.appendChild(option);
        });

        selectEl.addEventListener('change', (e) => {
            window.location.href = `lecture.html?id=${e.target.value}`;
        });

        // 3. Charger le chapitre
        function loadChapter(id) {
            const chapter = chapters.find(c => c.id === id);

            // On ne sert que les chapitres publiés sur Tapas. Les chapitres écrits
            // mais pas encore sortis ne sont ni lisibles ni teasés (même en accès
            // direct par ?id=). Ils réapparaissent dès que sync-tapas les publie.
            if (!chapter || !isPublished(chapter)) {
                titleEl.textContent = "Chapitre indisponible";
                numEl.textContent = "";
                document.title = "Lecture - Chapitre indisponible";
                contentEl.innerHTML = "<p style='text-align:center; color:#f39c12;'>Ce chapitre n'est pas encore disponible. Il sortira d'abord sur Tapas.</p>";
                const tapasBtn = document.getElementById('tapas-btn');
                if (tapasBtn) tapasBtn.style.display = 'none';
                prevBtn.classList.add('disabled');
                nextBtn.classList.add('disabled');
                return;
            }

            // Mettre à jour l'interface
            titleEl.textContent = chapter.title;
            numEl.textContent = `CHAPITRE ${chapter.id}`;
            document.title = `Lecture - ${chapter.title}`;

            // Navigation : uniquement parmi les chapitres publiés.
            const pubIdx = publishedChapters.findIndex(c => c.id === id);
            const prev = pubIdx > 0 ? publishedChapters[pubIdx - 1] : null;
            const next = pubIdx < publishedChapters.length - 1 ? publishedChapters[pubIdx + 1] : null;
            prevBtn.href = prev ? `lecture.html?id=${prev.id}` : '#';
            prevBtn.classList.toggle('disabled', !prev);
            nextBtn.href = next ? `lecture.html?id=${next.id}` : '#';
            nextBtn.classList.toggle('disabled', !next);

            // Tapas Link
            const tapasBtn = document.getElementById('tapas-btn');
            if (chapter.tapasLink && chapter.tapasLink.trim() !== "") {
                tapasBtn.href = chapter.tapasLink;
                tapasBtn.style.display = 'inline-block';
                tapasBtn.target = '_blank';
            } else {
                tapasBtn.style.display = 'none';
            }

            // LOGIQUE DE RESTRICTION : Seul le prologue (id 0) est lisible en entier
            if (id === 0) {
                // Fetch contenu complet pour le Prologue
                fetch(`../content/chapter/${chapter.filename}`)
                    .then(response => {
                        if (!response.ok) throw new Error("Erreur chargement");
                        return response.text();
                    })
                    .then(text => {
                        contentEl.innerHTML = parseMarkdown(text);
                    })
                    .catch(err => {
                        console.error(err);
                        contentEl.innerHTML = "<p style='text-align:center;'>Impossible de charger le prologue.</p>";
                    });
            } else {
                // Pour les autres chapitres : Afficher uniquement la preview
                if (chapter.preview) {
                    let html = parseMarkdown(chapter.preview);
                    html += "<br><hr><p style='text-align:center; font-style:italic; color:#f39c12; font-size:1.1rem;'>Ce chapitre est disponible exclusivement sur Tapas ou Wattpad.</p>";
                    if (chapter.tapasLink && chapter.tapasLink.trim() !== "") {
                        html += `<div style="text-align:center; margin-top:20px;"><a href="${chapter.tapasLink}" target="_blank" class="nav-btn" style="border-color: #f39c12; color: #f39c12;">Lire le chapitre sur Tapas ⬈</a></div>`;
                    }
                    contentEl.innerHTML = html;
                } else {
                    contentEl.innerHTML = "<p style='text-align:center;'>Aperçu non disponible.</p>";
                }
            }
        }

        // 4. Parseur Markdown Simple
        function parseMarkdown(text) {
            let html = text;

            // Nettoyage basique
            html = html.replace(/^---[\s\S]*?---/, ''); // Enlever frontmatter YAML si présent

            // Titres
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');

            // Gras et Italique
            html = html.replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');
            html = html.replace(/\*(.*)\*/gim, '<em>$1</em>');

            // Séparateurs
            html = html.replace(/^\*\*\*$/gim, '<hr>');
            html = html.replace(/^---$/gim, '<hr>');

            // Paragraphes (lignes vides)
            html = html.split(/\n\s*\n/).map(para => {
                if (para.trim().startsWith('<')) return para; // Déjà HTML (h1, etc)
                return `<p>${para.trim()}</p>`;
            }).join('');

            return html;
        }

        // Lancer le chargement
        loadChapter(currentId);

    </script>
</body>

</html>
