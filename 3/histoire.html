<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Archives de Parralela - Histoire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@300;500;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <script src="../js/db_histoire.js" charset="UTF-8"></script>

    <style>
        /* --- CONFIGURATION GLOBALE (Inspiré de index.html) --- */
        :root {
            --bg-deep: #050505;
            --gold-primary: #d4af37;
            --gold-light: #f9d976;
            --tech-cyan: #00f3ff;
            --text-main: #e0e0e0;
            --card-bg: rgba(20, 20, 25, 0.8);
        }

        body {
            margin: 0;
            background-color: var(--bg-deep);
            font-family: 'Cormorant Garamond', serif;
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- FOND --- */
        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            opacity: 0.8;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0, 0, 0, 0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0, 0, 0, 0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.3;
            animation: twinkle 5s infinite;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 0.3;
            }
        }

        /* --- HEADER & NAV --- */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: var(--gold-primary);
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            border: 1px solid var(--gold-primary);
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .back-btn:hover {
            background: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px var(--gold-primary);
        }

        .header-title {
            text-align: center;
            padding: 80px 20px 40px;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: var(--gold-primary);
            margin: 0;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            letter-spacing: 5px;
        }

        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            color: var(--gold-light);
            font-size: 1.2rem;
            letter-spacing: 3px;
            margin-top: 10px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* --- TIMELINE --- */
        .timeline {
            position: relative;
            max-width: 1000px;
            margin: 0 auto 100px;
            padding: 20px;
        }

        /* La ligne centrale */
        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: linear-gradient(to bottom, transparent, var(--gold-primary), var(--gold-primary), transparent);
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 60px;
            width: 50%;
            opacity: 0;
            animation: slideIn 0.8s ease-out forwards;
        }

        /* Alternance gauche/droite */
        .timeline-item:nth-child(odd) {
            left: 0;
            padding-right: 40px;
            text-align: right;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
            padding-left: 40px;
            text-align: left;
        }

        /* Le point sur la timeline */
        .timeline-item::after {
            content: '';
            position: absolute;
            top: 20px;
            width: 16px;
            height: 16px;
            background-color: var(--bg-deep);
            border: 2px solid var(--gold-primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--gold-primary);
            z-index: 10;
            transition: all 0.3s;
        }

        .timeline-item:nth-child(odd)::after {
            right: -9px;
            /* Ajustement pour centrer sur la ligne de 2px */
        }

        .timeline-item:nth-child(even)::after {
            left: -9px;
        }

        .timeline-item:hover::after {
            background-color: var(--gold-primary);
            box-shadow: 0 0 20px var(--gold-primary);
            transform: scale(1.2);
        }

        /* La carte de contenu */
        .arc-card {
            background: var(--card-bg);
            padding: 25px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, border-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        .arc-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-primary);
        }

        .arc-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
            opacity: 0.5;
        }

        .arc-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            margin: 0 0 10px 0;
            font-size: 1.5rem;
        }

        .arc-meta {
            font-family: 'Rajdhani', sans-serif;
            color: var(--tech-cyan);
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .arc-desc {
            line-height: 1.6;
            color: #ccc;
            font-size: 1.05rem;
        }

        /* --- ANIMATIONS --- */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Délais d'animation pour l'effet cascade */
        .timeline-item:nth-child(1) {
            animation-delay: 0.1s;
        }

        .timeline-item:nth-child(2) {
            animation-delay: 0.2s;
        }

        .timeline-item:nth-child(3) {
            animation-delay: 0.3s;
        }

        .timeline-item:nth-child(4) {
            animation-delay: 0.4s;
        }

        .timeline-item:nth-child(5) {
            animation-delay: 0.5s;
        }

        .timeline-item:nth-child(6) {
            animation-delay: 0.6s;
        }

        .timeline-item:nth-child(7) {
            animation-delay: 0.7s;
        }

        .timeline-item:nth-child(8) {
            animation-delay: 0.8s;
        }

        .timeline-item:nth-child(9) {
            animation-delay: 0.9s;
        }

        .timeline-item:nth-child(10) {
            animation-delay: 1.0s;
        }

        .timeline-item:nth-child(11) {
            animation-delay: 1.1s;
        }

        .timeline-item:nth-child(12) {
            animation-delay: 1.2s;
        }

        .timeline-item:nth-child(13) {
            animation-delay: 1.3s;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }

            .timeline-item {
                width: 100%;
                padding-left: 70px;
                padding-right: 0;
                text-align: left;
            }

            .timeline-item:nth-child(odd),
            .timeline-item:nth-child(even) {
                left: 0;
                text-align: left;
            }

            .timeline-item:nth-child(odd)::after,
            .timeline-item:nth-child(even)::after {
                left: 21px;
                right: auto;
            }
        }
    </style>
</head>

<body>

    <div class="background-layer"></div>
    <div class="stars-container"></div>

    <a href="../3/timeline.html" class="back-btn">◄ Retour au Hub</a>

    <div class="header-title">
        <h1>HISTOIRE DU MONDE</h1>
        <div class="subtitle">Chroniques de la Saison 1</div>
    </div>

    <div class="timeline" id="timeline"></div>

    <script>
        function renderHistoire() {
            const el = document.getElementById("timeline");
            el.innerHTML = histoireDB.map(arc => `
                <div class="timeline-item">
                    <div class="arc-card">
                        <h2 class="arc-title">${arc.title}</h2>
                        <div class="arc-meta">${arc.meta}</div>
                        <div class="arc-desc">${arc.desc}</div>
                    </div>
                </div>
            `).join("");
        }
        renderHistoire();
    </script>

</body>

</html>
