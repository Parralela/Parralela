<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Système Planétaire Parralela</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        /* --- 1. CONFIGURATION --- */
        :root {
            --bg-space: #05050b;
            --gold: #d4af37;
            --cyan: #00f3ff;
            --glass: rgba(20, 30, 40, 0.8);
        }

        body {
            margin: 0;
            background-color: var(--bg-space);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fond étoilé */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background-image: radial-gradient(1px 1px at 20px 30px, #fff, transparent), radial-gradient(2px 2px at 50px 160px, #fff, transparent); background-size: 200px 200px; opacity: 0.5; }

        /* --- 2. L'UNIVERS (La Caméra) --- */
        #universe-view {
            position: absolute;
            /* Le point d'origine (0,0) est PILE au centre de l'écran */
            top: 50%; left: 50%; 
            width: 0; height: 0;
            
            /* Transition fluide */
            transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1); 
            transform-style: preserve-3d;
        }

        /* Le Système Solaire */
        #solar-system {
            position: absolute;
            /* Le centre du système est sur le point d'origine */
            top: 0; left: 0; 
            /* On ne translate PAS ici, on laisse le JS gérer les mouvements */
            
            width: 0; height: 0; /* C'est un point virtuel */
            display: flex; justify-content: center; align-items: center;
        }

        /* L'Étoile Centrale */
        .sun {
            width: 180px; height: 180px;
            background: radial-gradient(circle, #fff, #ffd700, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 100px #ffd700;
            position: absolute;
            /* Centré sur le point 0,0 */
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            cursor: pointer;
            transition: 0.3s;
        }
        .sun:hover { box-shadow: 0 0 150px #ffec8b; transform: translate(-50%, -50%) scale(1.1); }

        /* --- 3. ORBITES & PLANÈTES --- */
        
        /* Le rail de l'orbite */
        .orbit-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Le groupe Planète */
        .planet-group {
            position: absolute;
            top: 50%; left: 50%;
            /* Pas de transform ici, c'est géré par left/top dans le JS */
            pointer-events: auto;
            cursor: pointer;
            transition: 0.3s;
            width: 0; height: 0; /* Point virtuel */
        }

        /* L'image de la planète */
        .planet-body {
            width: 60px; height: 60px;
            border-radius: 50%;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.8);
            transition: transform 0.5s;
            position: absolute;
            transform: translate(-50%, -50%); /* Centrage local */
            background-size: cover;
            background-position: center;
        }
        
        /* Nom de la planète */
        .planet-label {
            position: absolute;
            top: 40px; left: 50%; transform: translateX(-50%);
            font-family: 'Cinzel', serif; color: #fff; font-size: 0.8rem;
            text-shadow: 0 0 5px #000; pointer-events: none;
            opacity: 0.8; transition: 0.3s; white-space: nowrap;
        }

        .planet-group:hover .planet-body { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 20px var(--glow-color); }
        .planet-group:hover .planet-label { color: var(--glow-color); opacity: 1; }

        /* --- 4. LUNES --- */
        .moon-orbit {
            position: absolute;
            top: 0; left: 0; /* Relatif au centre de la planète */
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0; transition: opacity 1s;
            transform: translate(-50%, -50%); /* Centrage */
        }

        .moon-body {
            position: absolute;
            width: 12px; height: 12px;
            background: #ccc;
            border-radius: 50%;
            /* Positionné par JS */
            cursor: pointer;
            box-shadow: 0 0 5px #fff;
            transition: 0.3s;
            pointer-events: auto;
            transform: translate(-50%, -50%);
        }
        .moon-body:hover { transform: translate(-50%, -50%) scale(1.8); background: #fff; }

        .planet-focused .moon-orbit { opacity: 1; }

        /* --- 5. UI --- */
        #info-panel {
            position: fixed; right: -450px; top: 0; bottom: 0; width: 350px;
            background: var(--glass); backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255,255,255,0.1); padding: 40px;
            transition: 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: -10px 0 50px rgba(0,0,0,0.5); z-index: 100;
        }
        #info-panel.active { right: 0; }

        .info-type { color: var(--cyan); text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; margin-bottom: 10px; }
        .info-title { font-family: 'Cinzel', serif; font-size: 2.5rem; color: #fff; margin: 0 0 20px 0; line-height: 1; }
        .info-desc { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; line-height: 1.6; color: #ccc; margin-bottom: 30px; }
        .info-stats { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; color: #888; text-transform: uppercase; }
        .stat-val { color: var(--gold); font-weight: bold; }

        #back-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--bg-space); border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 30px; font-family: 'Rajdhani', sans-serif; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: 0.3s; border-radius: 30px; opacity: 0; z-index: 90;
        }
        #back-btn.visible { transform: translateX(-50%) translateY(0); opacity: 1; }
        #back-btn:hover { background: var(--gold); color: #000; }

        .nav-back { position: fixed; top: 20px; left: 20px; color: #aaa; text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; z-index: 100; }
        .nav-back:hover { color: #fff; }

    </style>
</head>
<body>

    <div class="stars"></div>
    <a href="codex_hub.html" class="nav-back">◄ Retour Codex</a>

    <div id="universe-view">
        <div id="solar-system">
            <div class="sun" onclick="goBack(true)"></div>
        </div>
    </div>

    <div id="info-panel">
        <div class="info-type" id="ui-type">Système</div>
        <h1 class="info-title" id="ui-name">Parralela</h1>
        <div class="info-desc" id="ui-desc">Sélectionnez un corps céleste pour l'analyser.</div>
        <div class="info-stats" id="ui-stats"></div>
    </div>

    <button id="back-btn" onclick="goBack()">Retour au Système</button>

    <script>
        const systemData = [
            { id: 'pyros', name: 'PYROS', type: 'Planète Élémentaire', color: '#e74c3c', distance: 300, moons: [{name:'Ignis', desc:'Explosions', distance:60, angle:0}, {name:'Vulcan', desc:'Magma', distance:80, angle:120}, {name:'Fumar', desc:'Fumée', distance:100, angle:240}] },
            { id: 'aquaria', name: 'AQUARIA', type: 'Planète Élémentaire', color: '#3498db', distance: 450, moons: [{name:'Glacius', desc:'Glace', distance:70, angle:45}, {name:'Abyssus', desc:'Profondeurs', distance:90, angle:180}, {name:'Nebula', desc:'Brume', distance:110, angle:300}] },
            { id: 'aeris', name: 'AERIS', type: 'Planète Gazeuse', color: '#bdc3c7', distance: 600, moons: [{name:'Stratos', desc:'Tempêtes', distance:80, angle:0}, {name:'Zephyria', desc:'Brises', distance:100, angle:120}, {name:'Vacuum', desc:'Vide', distance:120, angle:240}] },
            { id: 'lumia', name: 'LUMIA', type: 'Planète Radiante', color: '#f1c40f', distance: 750, moons: [{name:'Solara', desc:'Radiance', distance:70, angle:90}, {name:'Luxia', desc:'Illusions', distance:90, angle:210}, {name:'Photis', desc:'Rayons', distance:110, angle:330}] },
            { id: 'umbra', name: 'UMBRA', type: 'Planète Sombre', color: '#8e44ad', distance: 900, moons: [{name:'Nyx', desc:'Obscurité', distance:70, angle:30}, {name:'Noctis', desc:'Cauchemars', distance:90, angle:150}, {name:'Abyssum', desc:'Néant', distance:110, angle:270}] },
            { id: 'fulgora', name: 'FULGORA', type: 'Planète Énergétique', color: '#f39c12', distance: 1050, moons: [{name:'Tempestra', desc:'Foudre', distance:65, angle:0}, {name:'Electra', desc:'Magnétisme', distance:85, angle:120}, {name:'Ionis', desc:'Surcharge', distance:105, angle:240}] },
            { id: 'verdania', name: 'VERDANIA', type: 'Planète Vivante', color: '#2ecc71', distance: 1200, moons: [{name:'Floralis', desc:'Soin', distance:75, angle:60}, {name:'Radicis', desc:'Racines', distance:95, angle:180}, {name:'Venomera', desc:'Toxines', distance:115, angle:300}] },
            { id: 'terra', name: 'TERRA', type: 'Planète Tellurique', color: '#d35400', distance: 1350, moons: [{name:'Golem', desc:'Constructs', distance:80, angle:45}, {name:'Seismis', desc:'Séismes', distance:100, angle:165}, {name:'Metallia', desc:'Métaux', distance:120, angle:285}] }
        ];

        const container = document.getElementById('solar-system');
        const universe = document.getElementById('universe-view');
        const infoPanel = document.getElementById('info-panel');
        const backBtn = document.getElementById('back-btn');
        
        let currentFocus = { type: 'system', planetId: null };

        // --- GÉNÉRATION DU SYSTÈME ---
        systemData.forEach((planet, index) => {
            // 1. Orbite
            const orbitRing = document.createElement('div');
            orbitRing.className = 'orbit-ring';
            orbitRing.style.width = (planet.distance * 2) + 'px';
            orbitRing.style.height = (planet.distance * 2) + 'px';
            container.appendChild(orbitRing);

            // 2. Calcul Position
            const angleDeg = (index * 45) + 20; 
            const rad = angleDeg * (Math.PI / 180);
            const pX = Math.cos(rad) * planet.distance;
            const pY = Math.sin(rad) * planet.distance;

            // 3. Groupe Planète
            const group = document.createElement('div');
            group.className = 'planet-group';
            // Positionnement par rapport au centre (0,0) de l'univers
            group.style.left = pX + 'px';
            group.style.top = pY + 'px';

            group.onclick = (e) => { 
                e.stopPropagation(); 
                focusPlanet(planet, pX, pY, group); 
            };

            // Corps Planète
            const body = document.createElement('div');
            body.className = 'planet-body';
            body.style.backgroundColor = planet.color; 
            body.style.backgroundImage = `url('img/${planet.id}.png')`;
            
            const label = document.createElement('div');
            label.className = 'planet-label';
            label.innerText = planet.name;

            group.appendChild(body);
            group.appendChild(label);

            // 4. Les Lunes
            if(planet.moons) {
                planet.moons.forEach(moon => {
                    const mOrbit = document.createElement('div');
                    mOrbit.className = 'moon-orbit';
                    mOrbit.style.width = (moon.distance * 2) + 'px';
                    mOrbit.style.height = (moon.distance * 2) + 'px';
                    group.appendChild(mOrbit);

                    const mBody = document.createElement('div');
                    mBody.className = 'moon-body';
                    
                    const mRad = moon.angle * (Math.PI / 180);
                    const mX = Math.cos(mRad) * moon.distance;
                    const mY = Math.sin(mRad) * moon.distance;
                    
                    // La lune est positionnée relative au centre de la planète
                    mBody.style.left = mX + 'px';
                    mBody.style.top = mY + 'px';

                    mBody.onclick = (e) => {
                        e.stopPropagation();
                        // Position absolue de la lune = Pos Planète + Pos Lune relative
                        focusMoon(moon, planet, pX + mX, pY + mY);
                    };

                    group.appendChild(mBody);
                });
            }
            container.appendChild(group);
        });

        // --- FONCTION DE CAMÉRA CORRIGÉE ---
        
        function moveCamera(x, y, zoom) {
            // CORRECTION MAJEURE :
            // L'univers est déjà centré en CSS (50% 50%).
            // Si la planète est à X=300, Y=0, pour la centrer, on doit bouger l'univers de -300.
            // On applique le zoom.
            // Et on décale un peu (180px) pour laisser la place au panneau d'info si on zoom.
            
            const uiOffset = zoom > 1 ? 180 : 0;

            // La formule magique qui règle le cadrage :
            // On inverse les coordonnées de la cible (-x, -y)
            // On soustrait le décalage UI
            universe.style.transform = `translate(${-x * zoom - uiOffset}px, ${-y * zoom}px) scale(${zoom})`;
        }

        // Initialisation : Zoom arrière pour tout voir
        moveCamera(0, 0, 0.6);

        function focusPlanet(planet, x, y, element) {
            currentFocus = { type: 'planet', planetId: planet.id };
            
            moveCamera(x, y, 3.5); // Zoom moyen

            updateInfo(planet.name, planet.type, planet.desc, `Lunes: ${planet.moons.length}`);
            backBtn.innerText = "Retour Système";
            backBtn.classList.add('visible');

            document.querySelectorAll('.planet-group').forEach(el => el.classList.remove('planet-focused'));
            element.classList.add('planet-focused');
        }

        function focusMoon(moon, planet, totalX, totalY) {
            currentFocus = { type: 'moon', planetId: planet.id };

            moveCamera(totalX, totalY, 10); // Zoom fort

            updateInfo(moon.name, `Lune de ${planet.name}`, moon.desc, "Spécificité");
            backBtn.innerText = "Retour à " + planet.name;
        }

        function goBack(forceSystem = false) {
            if (currentFocus.type === 'moon' && !forceSystem) {
                // Retour Planète
                const planet = systemData.find(p => p.id === currentFocus.planetId);
                const index = systemData.indexOf(planet);
                const rad = ((index * 45) + 20) * (Math.PI / 180);
                const pX = Math.cos(rad) * planet.distance;
                const pY = Math.sin(rad) * planet.distance;
                
                const groups = document.querySelectorAll('.planet-group');
                focusPlanet(planet, pX, pY, groups[index]);

            } else {
                // --- INITIALISATION INTELLIGENTE (AUTO-ZOOM) ---
		// --- INITIALISATION INTELLIGENTE (AUTO-ZOOM) ---
		function fitSystemToScreen() {
            // Le rayon de l'orbite la plus lointaine (Terra = 1350px)
            // On ajoute une marge de sécurité (padding) de 200px pour les lunes et labels
            const systemRadius = 1350 + 200; 
            
            // On prend la plus petite dimension de l'écran (hauteur ou largeur)
            // C'est elle qui limite l'affichage
            const minDimension = Math.min(window.innerWidth, window.innerHeight);
            
            // Le diamètre total à afficher est (rayon * 2)
            // On calcule le ratio : "Combien de pixels d'écran j'ai pour chaque pixel du système ?"
            let optimalZoom = minDimension / (systemRadius * 2);
            
            // Petite réduction supplémentaire (90% de la taille max) pour aérer les bords
            optimalZoom = optimalZoom * 0.9;

            // Sécurité : On empêche le zoom d'être trop petit (illisible) ou trop grand
            // (Optionnel, mais évite les bugs sur écrans géants ou minuscules)
            optimalZoom = Math.max(0.2, Math.min(optimalZoom, 1));

            console.log("Zoom calculé : ", optimalZoom); // Pour débugger si besoin (F12)

            // On applique le zoom centré (0,0)
            moveCamera(0, 0, optimalZoom);
        }

        // Lancer au démarrage
        // Petit délai (10ms) pour laisser le temps au navigateur de calculer la taille de la fenêtre
        setTimeout(fitSystemToScreen, 10);
        
        // Recalculer si on redimensionne la fenêtre
        window.addEventListener('resize', () => {
            if(currentFocus.type === 'system') {
                fitSystemToScreen();
            }
        });
                
                infoPanel.classList.remove('active');
                backBtn.classList.remove('visible');
                document.querySelectorAll('.planet-group').forEach(el => el.classList.remove('planet-focused'));
                currentFocus = { type: 'system', planetId: null };
            }
        }

        function updateInfo(title, type, desc, stat) {
            document.getElementById('ui-name').innerText = title;
            document.getElementById('ui-type').innerText = type;
            document.getElementById('ui-desc').innerText = desc;
            
            const statsDiv = document.getElementById('ui-stats');
            statsDiv.innerHTML = `<div class="stat-row"><span>Info</span><span class="stat-val">${stat}</span></div>`;
            
            infoPanel.classList.add('active');
        }
    </script>

</body>
</html>
