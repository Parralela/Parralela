<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#05050b;}
  a{color:inherit;}
</style>
</helmet>
<div style="background:#05050b;min-height:100vh;box-sizing:border-box;color:#e0e0e0;padding:56px 64px 100px;position:relative;overflow:hidden;" data-screen-label="Dossier Lieu Unique">

  <div style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.5), transparent),radial-gradient(1px 1px at 68% 8%, rgba(255,255,255,0.4), transparent),radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.35), transparent),radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,0.4), transparent);background-size:600px 600px;opacity:0.6;"></div>

  <a href="LieuxUniques.dc.html" style="position:relative;z-index:2;display:inline-block;font-family:'Rajdhani',sans-serif;font-size:0.75rem;letter-spacing:2px;color:rgba(255,255,255,0.35);text-transform:uppercase;text-decoration:none;margin-bottom:40px;">◄ Retour Lieux Uniques</a>

  <div style="position:relative;z-index:2;max-width:900px;margin:0 auto;">

    <div style="border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:26px;margin-bottom:8px;">
      <div style="font-family:'Rajdhani',sans-serif;font-size:0.78rem;color:{{ color }};letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;">{{ type }}</div>
      <div style="font-family:'Cinzel',serif;font-size:2.4rem;color:#fff;letter-spacing:1px;margin-bottom:14px;">{{ name }}</div>
      <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:rgba(255,255,255,0.45);line-height:1.5;max-width:640px;">{{ desc }}</div>
    </div>

    <div style="display:flex;gap:28px;flex-wrap:wrap;margin:28px 0 36px;border-bottom:1px solid rgba(255,255,255,0.06);">
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
        <div onclick="{{ tab.select }}" style="cursor:pointer;padding:0 0 14px 0;font-family:'Rajdhani',sans-serif;font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;color:{{ tab.color }};border-bottom:2px solid {{ tab.underline }};">{{ tab.title }}</div>
      </sc-for>
    </div>

    <sc-for list="{{ activeSubsections }}" as="sub" hint-placeholder-count="3">
      <div style="margin-bottom:34px;">
        <div style="font-family:'Cinzel',serif;font-size:1.2rem;color:#fff;margin-bottom:12px;">{{ sub.title }}</div>
        <sc-if value="{{ sub.intro }}">
          <div style="font-family:'Cormorant Garamond',serif;font-size:1.08rem;line-height:1.6;color:#cfcfcf;margin-bottom:12px;">{{ sub.intro }}</div>
        </sc-if>
        <sc-for list="{{ sub.bullets }}" as="bullet" hint-placeholder-count="3">
          <div style="font-family:'Cormorant Garamond',serif;font-size:1.08rem;line-height:1.6;color:#cfcfcf;margin-bottom:8px;padding-left:16px;position:relative;">
            <span style="position:absolute;left:0;color:{{ color }};">—</span>
            <span style="color:#fff;font-weight:600;">{{ bullet.label }} </span>{{ bullet.text }}
          </div>
        </sc-for>
      </div>
    </sc-for>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
function sub(title, bullets, intro) { return { title, intro: intro || '', bullets: bullets || [] }; }
function b(label, text) { return { label: label || '', text }; }

const PLACES = {
  guilde: {
    name: 'La Guilde', type: 'Organisation', color: '#f1c40f',
    desc: "L'organisation centrale régissant les aventuriers, leurs rangs et leurs missions à travers Parralela.",
    sections: [
      { title: 'Système de Rangs', subsections: [
        sub('Principe', [], "Le classement des aventuriers ne repose pas sur des lettres ou des chiffres, mais sur des symboles célestes. Chaque rang se divise en trois paliers : Mineur (débutant du stade), Normal (confirmé et stable), Majeur (sommet du stade, prêt pour le suivant)."),
        sub('1. Météore', [
          b('Description :', 'Rang d\u2019entrée. Comme un fragment tombé du ciel : rapide, fragile, mais visible.'),
          b('Missions autorisées :', 'Tâches locales simples, escorte, petites chasses.'),
          b('Symbole :', 'Un trait lumineux gravé.')
        ]),
        sub('2. Lune', [
          b('Description :', 'Lumière stable, reflet qui guide. La fiabilité commence à être reconnue.'),
          b('Missions autorisées :', 'Quêtes de danger modéré, exploration de donjons faibles, escorte longue distance.'),
          b('Symbole :', 'Un croissant gravé, qui se complète en cercle à Lune Majeure.')
        ]),
        sub('3. Planète', [
          b('Description :', 'Centre de gravité, force qui attire et stabilise. Piliers de la Guilde.'),
          b('Missions autorisées :', 'Chasses de créatures puissantes, donjons moyens, protection de caravane, premières quêtes collectives.'),
          b('Symbole :', 'Cercle complet, parfois entouré d\u2019un anneau selon le palier.')
        ]),
        sub('4. Étoile', [
          b('Description :', 'Éclat puissant. Une lumière qui brille par elle-même et oriente les autres.'),
          b('Missions autorisées :', 'Grandes expéditions, créatures majeures, gisements sensibles (dont la parralith).'),
          b('Symbole :', 'Étoile à plusieurs branches, nombre croissant avec le palier.')
        ]),
        sub('5. Constellation', [
          b('Description :', 'Rang ultime. Ce ne sont plus seulement des individus puissants, mais des repères pour tout le monde.'),
          b('Missions autorisées :', 'Toutes, y compris les expéditions continentales et les menaces exceptionnelles.'),
          b('Symbole :', 'Plusieurs étoiles reliées entre elles, dessin unique pour chaque aventurier de ce rang.')
        ]),
        sub('Progression', [], 'Météore Mineur → Météore → Météore Majeur → Lune Mineure → … → Constellation Majeure.')
      ]}
    ]
  },
  hochedenia: {
    name: "Haute École d'Hochedenia", type: 'Académie', color: '#2ecc71',
    desc: "Le sommet de l'enseignement magique, formant l'élite de Parralela dans un cadre mystérieux et prestigieux.",
    sections: [
      { title: 'Structure', subsections: [
        sub('Localisation & Environnement', [], "L'école est située au cœur d'une ancienne forêt dans les hauteurs vallonnées du nord d'Hochedenia. Climat tempéré, architecture rappelant un château magique gigantesque, ailes enchâssées dans la nature."),
        sub('Durée des études', [
          b('Scolarité principale :', '6 années obligatoires.'),
          b('Spécialisation avancée :', '2 à 4 années supplémentaires, facultatives mais valorisées.'),
          b('', 'Le redoublement est possible mais très rare ; quitter l\u2019école avant la fin implique une absence de diplôme magique reconnu.')
        ]),
        sub('Organisation des cours', [
          b('', 'Élèves regroupés par tranche d\u2019âge, plusieurs classes par groupe.'),
          b('Cours généraux :', 'suivis avec la classe de référence.'),
          b('Cours d\u2019affinités :', 'groupes spécifiques selon les affinités magiques.'),
          b('Cours Bestia :', 'orientés sur le lien et la gestion de l\u2019animal.')
        ]),
        sub('Points et classements', [
          b('Points gagnés par :', 'notes et examens, activités pratiques, bon comportement et initiatives.'),
          b('Points perdus :', 'faute grave, désobéissance ou mise en danger.'),
          b('Classements officiels :', 'puissance brute (duels), moyennes académiques, inventions magiques, contributions communautaires.')
        ]),
        sub('Zones principales', [
          b('', 'Salles de classe, amphithéâtres, salles d\u2019entraînement magique, bibliothèque, dortoirs, réfectoire, jardin magique, ateliers, tour des invocations, colisée magique.')
        ]),
        sub('Zones restreintes', [
          b('Labyrinthe souterrain :', 'accessible à partir de la 3e année, seul ou encadré.'),
          b('Zone des professeurs :', 'sur autorisation seulement.'),
          b('Pièces secrètes :', 'enchantées, découverte exceptionnelle ou via énigmes.')
        ])
      ]},
      { title: 'Hiérarchie', subsections: [
        sub('Direction', [
          b('', 'Dirigée par un directeur unique, connu pour sa sagesse et son autorité naturelle.'),
          b('', 'Ancien membre des Sept Cimes, puissance immense mais n\u2019enseigne pas.'),
          b('', 'Intervient lors des grands événements et surveille les équilibres internes.')
        ]),
        sub('Corps enseignant', [
          b('Affinités :', 'l\u2019une des rares écoles capables d\u2019enseigner les 24 affinités ; au moins 8 professeurs pour les affinités planétaires.'),
          b('Général :', 'certains professeurs enseignent l\u2019histoire de la magie, les sorts généraux, l\u2019ingénierie magique, la stratégie.')
        ]),
        sub('Encadrement & pouvoir', [
          b('', 'Chaque classe dispose d\u2019un porte-parole ; des groupes étudiants organisés existent.'),
          b('', 'Garde magique et professeurs spécialisés assurent la sécurité interne.'),
          b('', 'École autonome, non soumise à un royaume ; diplôme reconnu dans tout Parralela.')
        ])
      ]},
      { title: 'Matières', subsections: [
        sub('Cours généraux', [ b('', 'Sortilèges généraux, potionologie, création de runes, ingénierie magique, histoire & culture magique, botanique & faune magique, contrôle du mana.') ]),
        sub('Cours par affinité', [ b('', '24 cours spécialisés : développement de sorts spécifiques, analyse de cas d\u2019usage réel, adaptation aux autres affinités, utilisation environnementale.') ]),
        sub('Bestia & armes uniques', [
          b('Cours Bestia :', 'non obligatoires, divisés par type d\u2019animal (aérien, terrestre, aquatique, mystique).'),
          b('Armes uniques :', 'maîtrise d\u2019arme spirituelle, sorts liés à l\u2019arme, Éveil Singulier.')
        ]),
        sub('Matières uniques à Hochedenia', [ b('', 'Analyse des résonances magiques, entraînement tactique appliqué, approche éthique de la puissance, exploration du Labyrinthe, magie combinatoire.') ])
      ]},
      { title: 'Vie Étudiante', subsections: [
        sub('Dortoirs', [ b('', 'Chambres individuelles regroupées par silo de 4, petite salle commune par silo, grande salle commune par dortoir. Dortoirs mixtes possibles à partir de la 4e année.') ]),
        sub('Repas', [ b('', 'Grand réfectoire magique, non obligatoire, aucune séparation par affinité.') ]),
        sub('Clubs & relations', [
          b('', 'Clubs autogérés mais reconnus (combat, stratégie, art...).'),
          b('', 'Relations amoureuses autorisées si sans nuisance ; rivalités courantes, saines ou conflictuelles.')
        ])
      ]},
      { title: 'Règles', subsections: [
        sub('Discipline', [ b('', 'Règles appliquées par le directeur et les encadrants ; conseil de discipline pour fautes graves. Exclusion définitive seulement pour faute majeure.') ]),
        sub('Duels', [
          b('Entraînement :', 'libres, en salle d\u2019entraînement.'),
          b('Conflit officiel :', 'soumis à validation, encadré, au Colisée.')
        ]),
        sub('Sécurité', [ b('', 'Mode non-létal obligatoire pour les armes uniques en duel ; salles renforcées magiquement ; infirmerie pour les blessures.') ])
      ]},
      { title: 'Événements', subsections: [
        sub('Calendrier annuel', [
          b('Tournoi Magique Annuel :', 'duels et épreuves pour tous les élèves.'),
          b('Tournoi Inter-écoles :', 'contre d\u2019autres grandes écoles.'),
          b('Bals saisonniers :', '5 par an, un par fin de saison.'),
          b('Exploration annuelle du Labyrinthe :', 'objectifs adaptés par année.'),
          b('Présentation des Projets Magiques :', 'exposition de créations et recherches.'),
          b('Veillée des Âmes :', 'hommage aux disparus.')
        ])
      ]},
      { title: 'Le Labyrinthe', subsections: [
        sub('Origine', [ b('', 'Résultat de l\u2019évolution d\u2019un ancien donjon de haut niveau, déformé par l\u2019accumulation d\u2019objets magiques.') ]),
        sub('Fonctionnement', [
          b('1er étage :', 'stable, cartographié, contrôlé.'),
          b('À partir du 2e étage :', 'instable, autonome, dangereux — plus de 40 étages connus.')
        ]),
        sub('Accès & risques', [
          b('Années 1-2 :', 'interdit sans professeur.'),
          b('Années 3+ :', 'accès libre au 1er étage, et aux suivants à leurs risques et périls.'),
          b('Sécurité :', '1er étage faiblement dangereux avec balises de traçage ; 2e étage et plus, risque de mort réel sans garantie de secours.')
        ])
      ]}
    ]
  }
};

class Component extends DCLogic {
  state = { activeSection: 0 };

  renderVals() {
    const params = new URLSearchParams(window.location.search);
    const data = PLACES[params.get('id')] || PLACES.guilde;
    const tabs = data.sections.map((s, i) => ({
      title: s.title,
      color: i === this.state.activeSection ? data.color : 'rgba(255,255,255,0.4)',
      underline: i === this.state.activeSection ? data.color : 'transparent',
      select: () => this.setState({ activeSection: i })
    }));
    return {
      name: data.name,
      type: data.type,
      color: data.color,
      desc: data.desc,
      tabs,
      activeSubsections: data.sections[this.state.activeSection].subsections
    };
  }
}

</script>
</body>
</html>
