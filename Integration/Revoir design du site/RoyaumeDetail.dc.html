<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#05050b;}
  a{color:inherit;}
</style>
</helmet>
<div style="background:#05050b;min-height:100vh;box-sizing:border-box;color:#e0e0e0;padding:56px 64px 100px;position:relative;overflow:hidden;" data-screen-label="Dossier Royaume">

  <div style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,0.5), transparent),radial-gradient(1px 1px at 68% 8%, rgba(255,255,255,0.4), transparent),radial-gradient(1px 1px at 40% 70%, rgba(255,255,255,0.35), transparent),radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,0.4), transparent);background-size:600px 600px;opacity:0.6;"></div>

  <div style="position:relative;z-index:2;display:flex;gap:24px;margin-bottom:40px;">
    <a href="Royaumes.dc.html" style="display:inline-block;font-family:'Rajdhani',sans-serif;font-size:0.75rem;letter-spacing:2px;color:rgba(255,255,255,0.35);text-transform:uppercase;text-decoration:none;">◄ Retour Royaumes</a>
    <a href="Cartographie.dc.html" style="display:inline-block;font-family:'Rajdhani',sans-serif;font-size:0.75rem;letter-spacing:2px;color:rgba(255,255,255,0.35);text-transform:uppercase;text-decoration:none;">Voir la carte</a>
  </div>

  <div style="position:relative;z-index:2;max-width:980px;margin:0 auto;">

    <div style="border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:26px;margin-bottom:36px;">
      <div style="font-family:'Rajdhani',sans-serif;font-size:0.78rem;color:{{ color }};letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;">{{ type }}</div>
      <div style="font-family:'Cinzel',serif;font-size:2.6rem;color:#fff;letter-spacing:1px;">{{ name }}</div>
    </div>

    <div style="display:flex;gap:56px;flex-wrap:wrap;">
      <div style="width:220px;display:flex;flex-direction:column;gap:22px;">
        <div>
          <div style="font-family:'Rajdhani',sans-serif;font-size:0.72rem;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">Capitale</div>
          <div style="font-family:'Cinzel',serif;font-size:1.05rem;color:#fff;">{{ capital }}</div>
        </div>
        <div>
          <div style="font-family:'Rajdhani',sans-serif;font-size:0.72rem;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">Pouvoir</div>
          <div style="font-family:'Cinzel',serif;font-size:1.05rem;color:#fff;">{{ power }}</div>
        </div>
        <div>
          <div style="font-family:'Rajdhani',sans-serif;font-size:0.72rem;color:rgba(255,255,255,0.35);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;">Stabilité</div>
          <div style="font-family:'Cinzel',serif;font-size:1.05rem;color:#fff;">{{ stability }}</div>
        </div>
        <div style="height:1px;background:rgba(255,255,255,0.08);"></div>
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;color:rgba(255,255,255,0.45);line-height:1.5;">{{ shortDesc }}</div>
      </div>

      <div style="flex:1;min-width:420px;display:flex;flex-direction:column;gap:38px;">
        <sc-for list="{{ sections }}" as="section" hint-placeholder-count="4">
          <div>
            <div style="font-family:'Cinzel',serif;font-size:1.3rem;color:{{ color }};border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:10px;margin-bottom:16px;">{{ section.title }}</div>
            <sc-for list="{{ section.bullets }}" as="bullet" hint-placeholder-count="3">
              <div style="font-family:'Cormorant Garamond',serif;font-size:1.1rem;line-height:1.6;color:#cfcfcf;margin-bottom:10px;">
                <span style="color:#fff;font-weight:600;">{{ bullet.label }} </span>{{ bullet.text }}
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>

</x-dc>

class Component extends DCLogic {
  renderVals() {
    const params = new URLSearchParams(window.location.search);
    const data = KINGDOMS[params.get('id')] || KINGDOMS.paidju;
    return { ...data };

</script>
</body>
</html>
