<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Dossier Lieu Unique</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/db_lieux.js" charset="UTF-8"></script>

    <style>
        .detail-nav {
            display: flex;
            gap: 24px;
            margin: 70px auto 30px;
            width: 90%;
            max-width: 980px;
        }

        .detail-navlink {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            text-decoration: none;
        }

        .detail-navlink:hover {
            color: #fff;
        }

        .detail-wrap {
            width: 90%;
            max-width: 980px;
            margin: 0 auto 100px;
        }

        .detail-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 26px;
            margin-bottom: 8px;
        }

        .detail-kicker {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .detail-title {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            color: #fff;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .detail-desc {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.5;
            max-width: 640px;
        }

        .detail-tabs {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            margin: 28px 0 36px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .detail-tab {
            cursor: pointer;
            padding: 0 0 14px 0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
            border-bottom: 2px solid transparent;
            background: none;
            border-left: none;
            border-right: none;
            border-top: none;
        }

        .detail-tab.active {
            font-weight: 600;
        }

        .detail-subsection {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: #fff;
            margin: 34px 0 12px;
        }

        .detail-subsection:first-child {
            margin-top: 0;
        }

        .detail-content {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.08rem;
            line-height: 1.6;
            color: #cfcfcf;
        }

        .detail-content h2,
        .detail-content h3,
        .detail-content h4 {
            font-family: 'Cinzel', serif;
            color: #fff;
            margin: 30px 0 14px;
        }

        .detail-content h2:first-child,
        .detail-content h3:first-child {
            margin-top: 0;
        }

        .detail-content ul {
            padding-left: 18px;
            margin: 0 0 14px;
        }

        .detail-content li {
            margin-bottom: 8px;
        }

        .detail-content strong {
            color: #fff;
            font-weight: 600;
        }

        .detail-content hr {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 26px 0;
        }
    </style>
</head>

<body class="codex-page">

    <div class="stars-container"></div>

    <div class="detail-nav">
        <a href="lieux_uniques.html" class="detail-navlink">◄ Retour Lieux Uniques</a>
    </div>

    <div class="detail-wrap" id="detailWrap"></div>

    <script>
        let activeSection = 0;

        function stripEmoji(html) {
            return html
                .replace(/[\p{Extended_Pictographic}‍️]/gu, '')
                .replace(/>\s+/g, '>')
                .replace(/[ \t]{2,}/g, ' ');
        }

        function render() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const l = lieuxDB[id];
            const wrap = document.getElementById('detailWrap');

            if (!l) {
                wrap.innerHTML = `<p class="detail-desc">Lieu introuvable dans les archives.</p>`;
                return;
            }

            document.title = l.name;

            const tabsHtml = (l.sections || []).map((section, i) => {
                const isActive = i === activeSection;
                return `<div class="detail-tab ${isActive ? 'active' : ''}" style="color:${isActive ? l.color : 'rgba(255,255,255,0.4)'};border-bottom-color:${isActive ? l.color : 'transparent'};" onclick="setSection(${i})">${section.title}</div>`;
            }).join('');

            const rawContent = (l.sections && l.sections[activeSection]) ? l.sections[activeSection].content : '<p>Aucune section disponible.</p>';
            const activeContent = stripEmoji(rawContent);

            wrap.innerHTML = `
                <div class="detail-header">
                    <div class="detail-kicker" style="color:${l.color}">${l.type}</div>
                    <div class="detail-title">${l.name}</div>
                    <div class="detail-desc">${l.description}</div>
                </div>
                <div class="detail-tabs">${tabsHtml}</div>
                <div class="detail-content">${activeContent}</div>
            `;
        }

        function setSection(i) {
            activeSection = i;
            render();
        }

        render();
    </script>
</body>

</html>
