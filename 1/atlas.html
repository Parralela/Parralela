<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Archives - Atlas & Lieux</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .md-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 70px auto 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 22px;
            width: 90%;
            max-width: 1100px;
        }

        .md-header-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: #eee;
        }

        .md-header-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        .md-header-meta {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .md-layout {
            display: flex;
            gap: 56px;
            width: 90%;
            max-width: 1100px;
            flex-wrap: wrap;
            margin-bottom: 100px;
        }

        .md-list {
            width: 300px;
            display: flex;
            flex-direction: column;
        }

        .md-row {
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 0 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 2px solid transparent;
            transition: background 0.3s, border-color 0.3s;
        }

        .md-row:last-child {
            border-bottom: none;
        }

        .md-row-icon {
            flex: none;
            display: flex;
        }

        .md-row-title {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #fff;
            display: block;
        }

        .md-row-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            margin-top: 2px;
            display: block;
        }

        .md-detail {
            flex: 1;
            min-width: 320px;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            padding-left: 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .md-kicker {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .md-title {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            color: #fff;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
        }

        .md-desc {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.55);
            max-width: 440px;
            margin: 0 0 30px 0;
        }

        .md-link {
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .md-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 760px) {
            .md-layout {
                flex-direction: column;
                gap: 30px;
            }

            .md-list {
                width: 100%;
            }

            .md-detail {
                border-left: none;
                padding-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 30px;
            }
        }
    </style>
</head>

<body class="atlas-page">

    <div class="stars-container"></div>
    <a href="../hub.html" class="back-btn">◄ Retour Grimoire</a>

    <div class="md-header">
        <div>
            <div class="md-header-title">Atlas & Lieux</div>
            <div class="md-header-sub">Cartographie, royaumes et environnements du monde connu</div>
        </div>
        <div class="md-header-meta">DOSSIER 01</div>
    </div>

    <div class="md-layout">
        <div class="md-list" id="mdList"></div>
        <div class="md-detail" id="mdDetail"></div>
    </div>

    <script>
        const items = [
            { title: 'Carte du Monde', color: '#3498db', order: '01', desc: 'Exploration interactive de la carte de Parralela. Visualisez les frontières, les mers et les terres sauvages.', tag: 'Interactive · Géographie · Zoom', href: 'cartographie.html', icon: 'M12 3 L16 12 L12 21 L8 12 Z|circle' },
            { title: 'Royaumes & Empires', color: '#9b59b6', order: '02', desc: 'Informations sur les grandes puissances, les cités-états et les factions politiques.', tag: 'Politique · Cités · Factions', href: 'royaumes.html', icon: 'M4 18 L4 10 L8 13 L12 5 L16 13 L20 10 L20 18 Z' },
            { title: 'Environnements', color: '#2ecc71', order: '03', desc: 'Biomes, climats et écosystèmes. Des forêts enchantées aux déserts de cristal.', tag: 'Biomes · Nature · Climat', href: 'environnements.html', icon: 'M12 4 C7 4 5 9 5 13 C5 17 8 20 12 20 C16 20 19 17 19 13 C19 9 17 4 12 4 Z M12 20 L12 12' },
            { title: 'Lieux Uniques', color: '#f1c40f', order: '04', desc: "Endroits légendaires, ruines anciennes et points d'intérêt magiques.", tag: 'Légendes · Ruines · Mystères', href: 'lieux_uniques.html', icon: 'M12 3 L14 9 L20 9 L15 13 L17 20 L12 16 L7 20 L9 13 L4 9 L10 9 Z' }
        ];

        let active = 0;

        function rowIcon(item) {
            const parts = item.icon.split('|');
            const circle = parts[1] ? `<circle cx="12" cy="12" r="9.5" stroke="${item.color}" stroke-width="1" opacity="0.4"/>` : '';
            return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="${parts[0]}" stroke="${item.color}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>${circle}</svg>`;
        }

        function setActive(i) {
            active = i;
            render();
        }

        function render() {
            const listEl = document.getElementById('mdList');
            listEl.innerHTML = items.map((item, i) => {
                const isActive = i === active;
                const borderColor = isActive ? item.color : 'transparent';
                const bg = isActive ? `linear-gradient(90deg, ${item.color}22, transparent)` : 'transparent';
                return `<a class="md-row" href="${item.href}" style="border-left-color:${borderColor};background:${bg};" onmouseenter="setActive(${i})">
                    <span class="md-row-icon">${rowIcon(item)}</span>
                    <span>
                        <span class="md-row-title">${item.title}</span>
                        <span class="md-row-sub">— ${item.order}</span>
                    </span>
                </a>`;
            }).join('');

            const item = items[active];
            document.getElementById('mdDetail').innerHTML = `
                <div class="md-kicker" style="color:${item.color}">${item.tag}</div>
                <h2 class="md-title">${item.title}</h2>
                <p class="md-desc">${item.desc}</p>
                <a class="md-link" style="color:${item.color}" href="${item.href}">Ouvrir →</a>
            `;
        }

        render();
    </script>
</body>

</html>
