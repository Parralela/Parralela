<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Dossier État</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/db_kingdoms.js" charset="UTF-8"></script>

    <style>
        .detail-nav {
            display: flex;
            gap: 24px;
            margin: 70px auto 30px;
            width: 90%;
            max-width: 980px;
        }

        .detail-navlink {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            text-decoration: none;
        }

        .detail-navlink:hover {
            color: #fff;
        }

        .detail-wrap {
            width: 90%;
            max-width: 980px;
            margin: 0 auto 100px;
        }

        .detail-header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 26px;
            margin-bottom: 36px;
        }

        .detail-kicker {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .detail-title {
            font-family: 'Cinzel', serif;
            font-size: 2.6rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .detail-body {
            display: flex;
            gap: 56px;
            flex-wrap: wrap;
        }

        .detail-sidebar {
            width: 220px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .sidebar-stat-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .sidebar-stat-value {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            color: #fff;
        }

        .sidebar-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar-desc {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.5;
        }

        .detail-main {
            flex: 1;
            min-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 38px;
        }

        .detail-section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
            margin-bottom: 16px;
        }

        .detail-bullet {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cfcfcf;
            margin-bottom: 10px;
        }

        .detail-bullet strong {
            color: #fff;
            font-weight: 600;
        }

        @media (max-width: 760px) {
            .detail-body {
                flex-direction: column;
            }

            .detail-sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 24px;
            }
        }
    </style>
</head>

<body class="codex-page">

    <div class="stars-container"></div>

    <div class="detail-nav">
        <a href="royaumes.html" class="detail-navlink">◄ Retour Royaumes</a>
        <a href="cartographie.html" class="detail-navlink">Voir la carte</a>
    </div>

    <div class="detail-wrap" id="detailWrap"></div>

    <script>
        const GEO_LABELS = { relief: 'Relief', access: 'Accès', isolation: 'Isolement', habitat: 'Habitat', cities: 'Cités souterraines', defense: 'Défense du territoire', config: 'Configuration', population: 'Répartition de la population', surface: 'Sol / Surface' };
        const CULTURE_LABELS = { mentality: 'Mentalité', magic: 'Rapport à la magie', social: 'Organisation sociale', moral: 'Vision morale', institution: 'Institution', society: 'Société', tech: 'Structures & savoir-faire' };
        const DEFENSE_LABELS = { forces: 'Forces armées', doctrine: 'Doctrine défensive', allies: 'Alliés' };
        const ROLE_LABELS = { function: 'Fonction dans l’histoire', symbol: 'Symbolique' };

        const SECTIONS = [
            { title: 'Géographie', key: 'geo', labels: GEO_LABELS },
            { title: 'Culture & Société', key: 'culture', labels: CULTURE_LABELS },
            { title: 'Défense & Sécurité', key: 'defense', labels: DEFENSE_LABELS },
            { title: 'Rôle Narratif', key: 'role', labels: ROLE_LABELS }
        ];

        function renderSection(section, k) {
            const obj = k[section.key];
            if (!obj) return '';
            const bullets = Object.entries(obj).map(([key, text]) => {
                const label = section.labels[key] || key;
                return `<div class="detail-bullet"><strong>${label} :</strong> ${text}</div>`;
            }).join('');
            return `<div>
                <div class="detail-section-title" style="color:${k.color}">${section.title}</div>
                ${bullets}
            </div>`;
        }

        function render() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const k = kingdomsDB[id];
            const wrap = document.getElementById('detailWrap');

            if (!k) {
                wrap.innerHTML = `<p class="sidebar-desc">Les archives ne contiennent aucune donnée sur cet état.</p>`;
                return;
            }

            document.title = 'Dossier — ' + k.name;

            wrap.innerHTML = `
                <div class="detail-header">
                    <div class="detail-kicker" style="color:${k.color}">${k.type}</div>
                    <div class="detail-title">${k.name}</div>
                </div>
                <div class="detail-body">
                    <div class="detail-sidebar">
                        <div>
                            <div class="sidebar-stat-label">Capitale</div>
                            <div class="sidebar-stat-value">${k.capital}</div>
                        </div>
                        <div>
                            <div class="sidebar-stat-label">Pouvoir</div>
                            <div class="sidebar-stat-value">${k.power}</div>
                        </div>
                        <div>
                            <div class="sidebar-stat-label">Stabilité</div>
                            <div class="sidebar-stat-value">${k.stability}</div>
                        </div>
                        <div class="sidebar-divider"></div>
                        <div class="sidebar-desc">${k.desc_short}</div>
                    </div>
                    <div class="detail-main">
                        ${SECTIONS.map(s => renderSection(s, k)).join('')}
                    </div>
                </div>
            `;
        }

        render();
    </script>
</body>

</html>
