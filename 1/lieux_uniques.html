<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Archives - Lieux Uniques</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/db_lieux.js" charset="UTF-8"></script>

    <style>
        .md-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 70px auto 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 22px;
            width: 90%;
            max-width: 1100px;
        }

        .md-header-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: #eee;
        }

        .md-header-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        .md-header-meta {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .md-layout {
            display: flex;
            gap: 56px;
            width: 90%;
            max-width: 1100px;
            flex-wrap: wrap;
            margin-bottom: 100px;
        }

        .md-list {
            width: 300px;
            display: flex;
            flex-direction: column;
        }

        .md-row {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 0 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 2px solid transparent;
            transition: background 0.3s, border-color 0.3s;
        }

        .md-row:last-child {
            border-bottom: none;
        }

        .md-row-icon {
            flex: none;
            display: flex;
        }

        .md-row-title {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #fff;
            display: block;
        }

        .md-row-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            margin-top: 2px;
            display: block;
        }

        .md-detail {
            flex: 1;
            min-width: 320px;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            padding-left: 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .md-kicker {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .md-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: #fff;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
        }

        .md-desc {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.55);
            max-width: 440px;
            margin: 0 0 30px 0;
        }

        .md-link {
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .md-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 760px) {
            .md-layout {
                flex-direction: column;
                gap: 30px;
            }

            .md-list {
                width: 100%;
            }

            .md-detail {
                border-left: none;
                padding-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 30px;
            }
        }
    </style>
</head>

<body class="codex-page">

    <div class="stars-container"></div>
    <a href="atlas.html" class="back-btn">◄ Retour Atlas</a>

    <div class="md-header">
        <div>
            <div class="md-header-title">Lieux Uniques</div>
            <div class="md-header-sub">Répertoire des sites uniques de Parralela</div>
        </div>
        <div class="md-header-meta">ATLAS · 04</div>
    </div>

    <div class="md-layout">
        <div class="md-list" id="mdList"></div>
        <div class="md-detail" id="mdDetail"></div>
    </div>

    <script>
        const ICONS = {
            guilde: 'M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z',
            hochedenia: 'M4 6 C4 6 8 4.5 12 6 C16 4.5 20 6 20 6 V18 C20 18 16 16.5 12 18 C8 16.5 4 18 4 18 Z M12 6 V18'
        };
        const DEFAULT_ICON = 'M12 3 L14 9 L20 9 L15 13 L17 20 L12 16 L7 20 L9 13 L4 9 L10 9 Z';

        const ids = Object.keys(lieuxDB);
        let active = 0;

        function rowIcon(id, color) {
            const path = ICONS[id] || DEFAULT_ICON;
            return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="${path}" stroke="${color}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
        }

        function setActive(i) {
            active = i;
            render();
        }

        function render() {
            const listEl = document.getElementById('mdList');
            listEl.innerHTML = ids.map((id, i) => {
                const l = lieuxDB[id];
                const isActive = i === active;
                const borderColor = isActive ? l.color : 'transparent';
                const bg = isActive ? `linear-gradient(90deg, ${l.color}22, transparent)` : 'transparent';
                return `<div class="md-row" style="border-left-color:${borderColor};background:${bg};" onmouseenter="setActive(${i})" onclick="setActive(${i})">
                    <span class="md-row-icon">${rowIcon(id, l.color)}</span>
                    <span>
                        <span class="md-row-title">${l.name}</span>
                        <span class="md-row-sub">${l.type}</span>
                    </span>
                </div>`;
            }).join('');

            const activeId = ids[active];
            const l = lieuxDB[activeId];
            document.getElementById('mdDetail').innerHTML = `
                <div class="md-kicker" style="color:${l.color}">${l.type}</div>
                <h2 class="md-title">${l.name}</h2>
                <p class="md-desc">${l.description}</p>
                <a class="md-link" style="color:${l.color}" href="lieu_unique_detail.html?id=${activeId}">Consulter le dossier →</a>
            `;
        }

        render();
    </script>
</body>

</html>
