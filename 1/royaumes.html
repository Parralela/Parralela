<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Archives - Royaumes & Empires</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/db_kingdoms.js" charset="UTF-8"></script>

    <style>
        .md-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin: 70px auto 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 22px;
            width: 90%;
            max-width: 1100px;
        }

        .md-header-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: #eee;
        }

        .md-header-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        .md-header-meta {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .md-layout {
            display: flex;
            gap: 56px;
            width: 90%;
            max-width: 1100px;
            flex-wrap: wrap;
            margin-bottom: 100px;
        }

        .md-list {
            width: 320px;
            display: flex;
            flex-direction: column;
        }

        .md-row {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 0 18px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 2px solid transparent;
            transition: background 0.3s, border-color 0.3s;
        }

        .md-row:last-child {
            border-bottom: none;
        }

        .md-row-icon {
            flex: none;
            display: flex;
        }

        .md-row-title {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #fff;
            display: block;
        }

        .md-row-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            margin-top: 2px;
            text-transform: uppercase;
            display: block;
        }

        .md-detail {
            flex: 1;
            min-width: 320px;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            padding-left: 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .md-kicker {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .md-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: #fff;
            margin: 0 0 20px 0;
            letter-spacing: 1px;
        }

        .md-desc {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.55);
            max-width: 460px;
            margin: 0 0 26px 0;
        }

        .md-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .md-tag {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.78rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .md-link {
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .md-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 760px) {
            .md-layout {
                flex-direction: column;
                gap: 30px;
            }

            .md-list {
                width: 100%;
            }

            .md-detail {
                border-left: none;
                padding-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 30px;
            }
        }
    </style>
</head>

<body class="codex-page">

    <div class="stars-container"></div>
    <a href="atlas.html" class="back-btn">◄ Retour Atlas</a>

    <div class="md-header">
        <div>
            <div class="md-header-title">Royaumes & Empires</div>
            <div class="md-header-sub">Les grandes puissances de Parralela</div>
        </div>
        <div class="md-header-meta">ATLAS · 02</div>
    </div>

    <div class="md-layout">
        <div class="md-list" id="mdList"></div>
        <div class="md-detail" id="mdDetail"></div>
    </div>

    <script>
        const ICONS = {
            paidju: 'M4 20h16M6 20V10M10 20V10M14 20V10M18 20V10M4 10l8-6 8 6',
            kaiyurt: 'M5 19 L18 6 M18 6 L21 6 L21 9 M5 19 L5 16 M5 19 L8 19',
            hochedenia: 'M12 4 C7 4 5 9 5 13 C5 17 8 20 12 20 C16 20 19 17 19 13 C19 9 17 4 12 4 Z M12 20 L12 12',
            harmouth: 'M4 18 L4 10 L8 13 L12 5 L16 13 L20 10 L20 18 Z'
        };
        const DEFAULT_ICON = 'M12 3 L19 6 V11 C19 16 16 19.5 12 21 C8 19.5 5 16 5 11 V6 Z';

        const ids = Object.keys(kingdomsDB);
        let active = 0;

        function rowIcon(id, color) {
            const path = ICONS[id] || DEFAULT_ICON;
            return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="${path}" stroke="${color}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
        }

        function setActive(i) {
            active = i;
            render();
        }

        function render() {
            const listEl = document.getElementById('mdList');
            listEl.innerHTML = ids.map((id, i) => {
                const k = kingdomsDB[id];
                const isActive = i === active;
                const borderColor = isActive ? k.color : 'transparent';
                const bg = isActive ? `linear-gradient(90deg, ${k.color}22, transparent)` : 'transparent';
                return `<div class="md-row" style="border-left-color:${borderColor};background:${bg};" onmouseenter="setActive(${i})" onclick="setActive(${i})">
                    <span class="md-row-icon">${rowIcon(id, k.color)}</span>
                    <span>
                        <span class="md-row-title">${k.name}</span>
                        <span class="md-row-sub">${k.type}</span>
                    </span>
                </div>`;
            }).join('');

            const activeId = ids[active];
            const k = kingdomsDB[activeId];
            document.getElementById('mdDetail').innerHTML = `
                <div class="md-kicker" style="color:${k.color}">Capitale — ${k.capital}</div>
                <h2 class="md-title">${k.name}</h2>
                <p class="md-desc">${k.desc_short}</p>
                <div class="md-tags">
                    <span class="md-tag" style="color:${k.color}">${k.type}</span>
                    <span class="md-tag" style="color:${k.color}">${k.power}</span>
                    <span class="md-tag" style="color:${k.color}">${k.stability}</span>
                </div>
                <a class="md-link" style="color:${k.color}" href="royaume_detail.html?id=${activeId}">Voir le dossier complet →</a>
            `;
        }

        render();
    </script>
</body>

</html>
