<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Archives - Environnements de Parralela</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/db_biomes.js" charset="UTF-8"></script>

    <style>
        .md-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin: 70px auto 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 22px;
            width: 90%;
            max-width: 1180px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .md-header-title {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: #eee;
        }

        .md-header-sub {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.1rem;
            margin-top: 8px;
        }

        .env-search {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            padding: 9px 16px;
            width: 260px;
            box-sizing: border-box;
        }

        .env-search:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .md-layout {
            display: flex;
            gap: 56px;
            width: 90%;
            max-width: 1180px;
            flex-wrap: wrap;
            margin-bottom: 100px;
        }

        .md-list {
            width: 340px;
            max-height: 620px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-right: 8px;
        }

        .md-list::-webkit-scrollbar {
            width: 5px;
        }

        .md-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
        }

        .md-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .md-empty {
            font-family: 'Rajdhani', sans-serif;
            color: rgba(255, 255, 255, 0.35);
            padding: 20px 0;
        }

        .md-row {
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 0 14px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            border-left: 2px solid transparent;
            transition: background 0.3s, border-color 0.3s;
        }

        .md-row-icon {
            flex: none;
            margin-top: 2px;
            display: flex;
        }

        .md-row-title {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            color: #fff;
            line-height: 1.3;
            display: block;
        }

        .md-row-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            margin-top: 3px;
            text-transform: uppercase;
            display: block;
        }

        .md-detail {
            flex: 1;
            min-width: 320px;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            padding-left: 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .md-kicker {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.72rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .md-title {
            font-family: 'Cinzel', serif;
            font-size: 2.1rem;
            color: #fff;
            margin: 0 0 18px 0;
            letter-spacing: 1px;
        }

        .md-desc {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.55);
            max-width: 460px;
            margin: 0 0 24px 0;
        }

        .md-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .md-tag {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.78rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .md-link {
            text-decoration: none;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .md-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 760px) {
            .md-layout {
                flex-direction: column;
                gap: 30px;
            }

            .md-list {
                width: 100%;
                max-height: 360px;
            }

            .md-detail {
                border-left: none;
                padding-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                padding-top: 30px;
            }
        }
    </style>
</head>

<body class="codex-page">

    <div class="stars-container"></div>
    <a href="atlas.html" class="back-btn">◄ Retour Atlas</a>

    <div class="md-header">
        <div>
            <div class="md-header-title">Environnements</div>
            <div class="md-header-sub">Biomes et écosystèmes de Parralela</div>
        </div>
        <input type="text" id="envSearch" class="env-search" placeholder="Rechercher un biome, un lieu..." oninput="onSearch(event)">
    </div>

    <div class="md-layout">
        <div class="md-list" id="mdList"></div>
        <div class="md-detail" id="mdDetail"></div>
    </div>

    <script>
        const ICON_PATHS = {
            terrestre: 'M3 19 L9 8 L13 14 L16 10 L21 19 Z',
            aquatique: 'M3 12c2 -3 4 -3 6 0s4 3 6 0s4 -3 6 0',
            souterrain: 'M4 20 L4 13 C4 7 8 4 12 4 C16 4 20 7 20 13 L20 20',
            aerien: 'M7 16a4 4 0 0 1 0-8 5 5 0 0 1 9.8 1.2A3.5 3.5 0 0 1 16.5 16H7Z'
        };

        function categoryOf(typeStr) {
            const t = (typeStr || '').toLowerCase();
            if (t.includes('souterrain')) return 'souterrain';
            if (t.includes('aquatique')) return 'aquatique';
            if (t.includes('aérien') || t.includes('aerien')) return 'aerien';
            return 'terrestre';
        }

        function typeLabelOf(typeStr) {
            return (typeStr || '').replace(/,\s*/g, ' · ');
        }

        let active = 0;
        let query = '';

        function filteredIndices() {
            const q = query.trim().toLowerCase();
            return biomesData
                .map((b, i) => i)
                .filter(i => {
                    const b = biomesData[i];
                    return !q || b.name.toLowerCase().includes(q) || (b.location || '').toLowerCase().includes(q);
                });
        }

        function rowIcon(biome) {
            const path = ICON_PATHS[categoryOf(biome.type)];
            return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="${path}" stroke="${biome.color}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
        }

        function setActive(i) {
            active = i;
            render();
        }

        function onSearch(e) {
            query = e.target.value;
            render();
        }

        function render() {
            const indices = filteredIndices();
            if (!indices.includes(active)) active = indices.length ? indices[0] : active;

            const listEl = document.getElementById('mdList');
            if (!indices.length) {
                listEl.innerHTML = `<div class="md-empty">Aucun résultat.</div>`;
            } else {
                listEl.innerHTML = indices.map(i => {
                    const b = biomesData[i];
                    const isActive = i === active;
                    const borderColor = isActive ? b.color : 'transparent';
                    const bg = isActive ? `linear-gradient(90deg, ${b.color}1a, transparent)` : 'transparent';
                    return `<div class="md-row" style="border-left-color:${borderColor};background:${bg};" onmouseenter="setActive(${i})" onclick="setActive(${i})">
                        <span class="md-row-icon">${rowIcon(b)}</span>
                        <span>
                            <span class="md-row-title">${b.name}</span>
                            <span class="md-row-sub">${typeLabelOf(b.type)}</span>
                        </span>
                    </div>`;
                }).join('');
            }

            const detailEl = document.getElementById('mdDetail');
            if (!indices.length) {
                detailEl.innerHTML = `<p class="md-desc">Aucun biome ne correspond à cette recherche.</p>`;
                return;
            }
            const b = biomesData[active];
            detailEl.innerHTML = `
                <div class="md-kicker" style="color:${b.color}">${typeLabelOf(b.type)} · ${b.location || ''}</div>
                <h2 class="md-title">${b.name}</h2>
                <p class="md-desc">${b.dominantBiome || ''}</p>
                <div class="md-tags">
                    <span class="md-tag" style="color:${b.color}">Hostilité — ${b.hostility || 'Inconnue'}</span>
                </div>
                <a class="md-link" style="color:${b.color}" href="environnement_detail.html?id=${b.id}">Voir le dossier complet →</a>
            `;
        }

        render();
    </script>
</body>

</html>
